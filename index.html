<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
>

<meta name="theme-color" content="#162b35">

<title>Tarai — RPG Prologue</title>

<style>

/* ================================================================
   [CSS 01] SCHERMO VERTICALE
   ================================================================ */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0b161c;
  font-family: Arial, sans-serif;
  color: white;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: none;
  overscroll-behavior: none;
}

#game {
  position: relative;
  width: min(100vw, 56.25vh);
  height: min(100vh, 177.7778vw);
  overflow: hidden;
  background: #162b35;
}

@supports (height: 100dvh) {
  #game {
    width: min(100vw, 56.25dvh);
    height: min(100dvh, 177.7778vw);
  }
}

#world {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  touch-action: none;
}

/* ================================================================
   [CSS 02] SPRITE DI RICCARDO

   Dimensioni e punto di appoggio vengono impostati dal JavaScript.
   Le GIF rimangono immagini HTML per mantenere l'animazione.
   ================================================================ */

#actorLayer {
  position: absolute;
  inset: 0;
  z-index: 2;
  overflow: hidden;
  pointer-events: none;
}

.actor-image {
  position: absolute;
  display: none;
  width: auto;
  max-width: none;
  max-height: none;
  image-rendering: pixelated;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}

/* ================================================================
   [CSS 03] INFORMAZIONI E PULSANTI
   ================================================================ */

#hud {
  position: absolute;
  top: max(12px, env(safe-area-inset-top));
  left: 12px;
  right: 12px;
  z-index: 4;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  pointer-events: none;
}

.panel {
  padding: 9px 11px;
  border: 1px solid #a0c4cc66;
  border-radius: 8px;
  background: #102631e8;
  box-shadow: 0 3px 12px #0004;
  line-height: 1.4;
}

.eyebrow {
  color: #f6d78e;
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 1.5px;
}

#objective {
  margin-top: 3px;
  font-size: 12px;
}

#status {
  margin-top: 3px;
  max-width: 235px;
  color: #b9d4dc;
  font-size: 10px;
  overflow-wrap: anywhere;
}

button {
  min-width: 42px;
  min-height: 42px;
  border: 1px solid #9bbbc7aa;
  border-radius: 8px;
  background: #102631e8;
  color: #f2f7f9;
  font: inherit;
  cursor: pointer;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible {
  outline: 3px solid #f7d580;
  outline-offset: 2px;
}

#resetButton {
  font-size: 22px;
  pointer-events: auto;
}

/* ================================================================
   [CSS 04] JOYSTICK E ZOOM
   ================================================================ */

#controls {
  position: absolute;
  left: 0;
  right: 0;
  bottom: max(18px, env(safe-area-inset-bottom));
  height: 134px;
  z-index: 4;
  pointer-events: none;
}

#joystick {
  position: absolute;
  left: 18px;
  bottom: 0;
  width: 124px;
  height: 124px;
  border: 2px solid #e5f1f57a;
  border-radius: 50%;
  background: #132f3b70;
  box-shadow: 0 2px 15px #0005;
  pointer-events: auto;
  touch-action: none;
  user-select: none;
}

#joystick::before {
  content: "✥";
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: #d5e9ee44;
  font-size: 78px;
}

#stick {
  position: absolute;
  left: 38px;
  top: 38px;
  width: 44px;
  height: 44px;
  border: 2px solid #fff9;
  border-radius: 50%;
  background: #dfedf0b8;
  box-shadow: 0 2px 6px #0005;
  pointer-events: none;

#zoomControls {

  right: 16px;
  bottom: 3px;

  gap: 8px;

#zoomControls button {
  width: 44px;
  height: 44px;
  font-size: 24px;
}

/* ================================================================
   [CSS 05] CARICAMENTO
   ================================================================ */

}

<script>
"use strict";

/* ================================================================
   [CONFIG 01] MAPPA E MOVIMENTO
   Coordinate della mappa: 1024 × 1536.
   ================================================================ */

const CONFIG = {

  map:
    "https://i.ibb.co/vCkKyDnG/file-000000001d2c82119d2853d5d3b5152a.png",

  referenceWidth: 1024,
  referenceHeight: 1536,

  start: {

  },

  speed: 135,
  collisionRadius: 5,

  zoom: 1.35,
  minZoom: 0.7,
  maxZoom: 2.8,

  collisions: true,
  debug: false

};

/* ================================================================
   [CONFIG 02] DIMENSIONE DI RICCARDO

   Cambia height per ingrandire o rimpicciolire TUTTE le pose.
   Il valore è riferito alla mappa, prima dello zoom.

   ground: punto dei piedi dentro l'immagine.
   1 = bordo inferiore.
   0.974 = piedi poco sopra il bordo inferiore.

   scale: correzione facoltativa della singola immagine.
   offsetX / offsetY: correzione della singola posa sulla mappa.
   ================================================================ */

const RICCARDO = {

  height: 54,

  idle: {

    right: {
      file: "Riccardo_fermo_destra.png",

    },

    down: {

    },

      ground: 341 / 350,
      scale: 1,
      offsetX: 0,
      offsetY: 0
    },

    up: {
      file: "Riccardo_fermo_su.png",
      ground: 341 / 350,
      scale: 1,
      offsetX: 0,
      offsetY: 0
    }

  },

  walk: {

    right: {
      file: "Riccardo_camminata_destra.gif",
      ground: 0.974,
      scale: 1,
      offsetX: 0,
      offsetY: 0
    },

    down: {
      file: "file_0000000005dc8230b315715b4e8d1917.gif",
      ground: 0.974,
      scale: 1,
      offsetX: 0,
      offsetY: 0
    },

    left: {
      file: "Riccardo_camminata_sinistra.gif",
      ground: 0.974,
      scale: 1,
      offsetX: 0,
      offsetY: 0
    },

    up: {
      file: "Riccardo_camminata_su-1.gif",
      ground: 0.974,
      scale: 1,
      offsetX: 0,
      offsetY: 0
    }

  }

};

/* ================================================================
   [MAP 01] COLLISIONI DEFINITIVE

   Questi poligoni sostituiscono le vecchie zone WALKABLE
   e i vecchi rettangoli OBSTACLES.
   ================================================================ */

const VERSIONE_COLLISIONI = "seoul-2026-11-04-01";

const COLLISION_STORAGE = "tarai-seoul-collisions-v2";

const COLLISIONI_DEFINITIVE = [

  [[0,0],[1024,0],[1024,385],[0,385]],
  [[0,385],[98,385],[98,591],[0,591]],
  [[976,394],[1024,385],[1024,591],[991,566]],

  [[887,448],[896,448],[896,493],[887,493]],
  [[909,448],[918,448],[918,493],[909,493]],

  [[301,563],[313,563],[313,577],[301,577]],
  [[717,563],[729,563],[729,577],[717,577]],

  [[331,541],[346,541],[346,574],[331,574]],
  [[391,541],[406,541],[406,574],[391,574]],
  [[451,541],[466,541],[466,574],[451,574]],
  [[565,541],[580,541],[580,574],[565,574]],
  [[625,541],[640,541],[640,574],[625,574]],
  [[685,541],[700,541],[700,574],[685,574]],

  [[0,596],[433,596],[433,733],[0,733]],
  [[585,599],[1002,592],[997,719],[588,715]],

  [[0,759],[384,755],[386,1086],[0,1086]],
  [[0,1111],[380,1111],[376,1479],[0,1479]],

  [[553,783],[1024,761],[1020,1062],[556,1062]],

  [[382,874],[448,874],[435,955],[385,950]],

  [[525,1056],[551,1056],[551,1083],[525,1083]],
  [[600,1097],[626,1097],[626,1115],[600,1115]],

  [
    [550,1193],
    [595,1193],
    [595,1180],
    [1024,1180],
    [1024,1465],
    [805,1465],

    [710,1465],

  ],

  [[548,1435],[685,1435],[685,1470],[548,1470]],
  [[835,1435],[1024,1435],[1024,1470],[835,1470]],

  [[174,1430],[327,1430],[327,1480],[174,1480]],
  [[358,1432],[378,1432],[378,1470],[358,1470]],

  [[554,1017],[528,1018],[527,959],[552,958]],

  [
    [926,493],
    [929,460],
    [927,452],
    [941,452],
    [938,495],
    [927,493]
  ],

  [[946,493],[948,456],[958,452],[958,494],[949,494]],
  [[967,457],[968,495],[965,492],[961,457]],

  [[534,1350],[498,1348],[503,1408],[536,1407]],
  [[552,1483],[509,1480],[521,1446],[554,1430]],

  [[297,549],[296,532],[309,531],[312,553]],

  [[190,1087],[191,1112],[0,1111],[0,1088]],

  [[944,1161],[947,1123],[1014,1125],[1012,1160]],

  [[385,1084],[410,1089],[410,1018],[385,1012]],

  [[983,1532],[986,1480],[987,1474],[1024,1472]]

];

/* ================================================================
   [MAP 02] RECUPERO DELLE COLLISIONI SALVATE

   Conserva gli eventuali ritocchi fatti nell'editor
   per questa stessa versione delle collisioni.
   ================================================================ */

function validCollisionData(data) {

  return (
    Array.isArray(data) &&
    data.length > 0 &&
    data.every(polygon =>
      Array.isArray(polygon) &&
      polygon.length >= 3 &&
      polygon.every(point =>
        Array.isArray(point) &&
        point.length === 2 &&
        point.every(Number.isFinite)
      )
    )
  );

}

function loadCollisions() {

  const defaults = COLLISIONI_DEFINITIVE.map(
    polygon => polygon.map(point => [...point])
  );

  try {

    const version = localStorage.getItem(
      "tarai-collision-release"
    );

    const saved = JSON.parse(
      localStorage.getItem(COLLISION_STORAGE)
    );

    if (
      version === VERSIONE_COLLISIONI &&
      validCollisionData(saved)
    ) {
      return saved;
    }

    localStorage.setItem(
      COLLISION_STORAGE,
      JSON.stringify(defaults)
    );

    localStorage.setItem(
      "tarai-collision-release",
      VERSIONE_COLLISIONI
    );

  } catch (_) {}

  return defaults;

}

let colliderPolygons = loadCollisions();

/* ================================================================
   [JS 01] ELEMENTI E STATO
   ================================================================ */

const game = document.getElementById("game");
const canvas = document.getElementById("world");
const ctx = canvas.getContext("2d");

const actorLayer = document.getElementById("actorLayer");
const loading = document.getElementById("loading");
const statusText = document.getElementById("status");

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

const mapImage = new Image();

const player = {
  x: CONFIG.start.x,
  y: CONFIG.start.y,
  direction: "down",
  moving: false
};

const camera = {
  x: 0,
  y: 0
};

const keys = new Set();

const analog = {
  x: 0,
  y: 0
};

const actorAssets = {
  idle: {},
  walk: {}
};

const failedAssets = new Set();

let activeAsset = null;
let ready = false;
let lastTime = 0;
let viewWidth = 1;
let viewHeight = 1;
let joystickPointer = null;

function clamp(value, minimum, maximum) {

  return Math.max(
    minimum,
    Math.min(maximum, value)
  );

}

/* ================================================================
   [JS 02] CARICAMENTO DELLE OTTO POSE

   Ogni file viene caricato una volta sola.
   Non cambiamo continuamente src durante il movimento.
   ================================================================ */

function loadActorAssets() {

  for (const mode of ["idle", "walk"]) {

    for (const direction of ["down", "up", "right", "left"]) {

      const settings = RICCARDO[mode][direction];

      const image = new Image();

      const asset = {
        image,
        settings,
        loaded: false
      };

      image.className = "actor-image";
      image.alt = "";
      image.draggable = false;

      image.onload = function() {

        asset.loaded = true;

        failedAssets.delete(settings.file);

      };

      image.onerror = function() {

        asset.loaded = false;

        failedAssets.add(settings.file);

      };

      actorAssets[mode][direction] = asset;

      actorLayer.appendChild(image);

      image.src = settings.file;

    }

  }

}

function selectActorAsset() {

  const mode = player.moving ? "walk" : "idle";

  const requested = actorAssets[mode][player.direction];

  if (requested && requested.loaded) {
    return requested;
  }

  // Se una GIF manca, prova la posa ferma della stessa direzione.

  const sameDirection = actorAssets.idle[player.direction];

  if (sameDirection && sameDirection.loaded) {
    return sameDirection;
  }

  // Ultima alternativa: una delle pose ferme disponibili.

  for (const direction of ["down", "up", "right", "left"]) {

    const asset = actorAssets.idle[direction];

    if (asset && asset.loaded) {
      return asset;
    }

  }

  return null;

}

/* ================================================================
   [JS 03] POSIZIONE DELLO SPRITE SOPRA LA MAPPA

   player.x e player.y rappresentano il punto dei piedi.
   La larghezza mantiene le proporzioni originali del file.
   ================================================================ */

function drawActor() {

  const asset = selectActorAsset();

  if (activeAsset !== asset) {

    if (activeAsset) {
      activeAsset.image.style.display = "none";
    }

    activeAsset = asset;

    if (activeAsset) {
      activeAsset.image.style.display = "block";
    }

  }

  if (!asset) {
    return;
  }

  const settings = asset.settings;

  const screenX = (
    player.x +
    settings.offsetX -
    camera.x
  ) * CONFIG.zoom;

  const screenY = (
    player.y +
    settings.offsetY -
    camera.y
  ) * CONFIG.zoom;

  const height = (
    RICCARDO.height *
    settings.scale *
    CONFIG.zoom
  );

  asset.image.style.height = height + "px";

  asset.image.style.left = Math.round(screenX) + "px";

  asset.image.style.top = Math.round(screenY) + "px";

  asset.image.style.transform =
    "translate(-50%, -" +
    (settings.ground * 100) +
    "%)";

}

/* ================================================================
   [JS 04] RIDIMENSIONAMENTO
   ================================================================ */

function resize() {

  const rect = game.getBoundingClientRect();

  viewWidth = Math.max(1, rect.width);
  viewHeight = Math.max(1, rect.height);

  const density = Math.min(
    window.devicePixelRatio || 1,
    2
  );

  canvas.width = Math.round(viewWidth * density);
  canvas.height = Math.round(viewHeight * density);

  ctx.setTransform(density, 0, 0, density, 0, 0);

  ctx.imageSmoothingEnabled = false;

  if (ready) {
    updateCamera();
    draw();
  }

}

new ResizeObserver(resize).observe(game);

window.addEventListener("resize", resize);

/* ================================================================
   [JS 05] ZOOM DELLA CAMERA
   ================================================================ */

function setZoom(value) {

  CONFIG.zoom = clamp(
    value,
    CONFIG.minZoom,
    CONFIG.maxZoom
  );

  if (ready) {
    updateCamera();
    draw();
  }

}

document.getElementById("zoomIn").onclick = function() {
  setZoom(CONFIG.zoom + 0.2);
};

document.getElementById("zoomOut").onclick = function() {
  setZoom(CONFIG.zoom - 0.2);
};

/* ================================================================
   [JS 06] COLLISIONE: PUNTO DENTRO UN POLIGONO
   ================================================================ */

function pointInPolygon(x, y, polygon) {

  let inside = false;

  for (
    let i = 0, j = polygon.length - 1;
    i < polygon.length;
    j = i++
  ) {

    const [xi, yi] = polygon[i];
    const [xj, yj] = polygon[j];

    const crosses = (
      (yi > y) !== (yj > y) &&
      x < (xj - xi) * (y - yi) / (yj - yi) + xi
    );

    if (crosses) {
      inside = !inside;
    }

  }

  return inside;

}

/* ================================================================
   [JS 07] COLLISIONE: DISTANZA DAI BORDI

   Il piccolo cerchio dei piedi non deve attraversare
   né l'interno né i bordi degli ostacoli.
   ================================================================ */

function distanceToSegmentSquared(
  px, py,
  ax, ay,
  bx, by
) {

  const dx = bx - ax;
  const dy = by - ay;

  const lengthSquared = dx * dx + dy * dy;

  if (lengthSquared === 0) {

    return (
      (px - ax) ** 2 +
      (py - ay) ** 2
    );

  }

  const t = clamp(
    (
      (px - ax) * dx +
      (py - ay) * dy
    ) / lengthSquared,
    0,
    1
  );

  const nearestX = ax + t * dx;
  const nearestY = ay + t * dy;

  return (
    (px - nearestX) ** 2 +
    (py - nearestY) ** 2
  );

}

function circleHitsPolygon(x, y, radius, polygon) {

  if (pointInPolygon(x, y, polygon)) {
    return true;
  }

  const radiusSquared = radius * radius;

  for (let i = 0; i < polygon.length; i++) {

    const a = polygon[i];

    const b = polygon[
      (i + 1) % polygon.length
    ];

    if (
      distanceToSegmentSquared(
        x, y,
        a[0], a[1],
        b[0], b[1]
      ) <= radiusSquared
    ) {
      return true;
    }

  }

  return false;

}

function canStand(x, y) {

  const radius = CONFIG.collisionRadius;

  if (
    x < radius ||
    y < radius ||
    x > CONFIG.referenceWidth - radius ||
    y > CONFIG.referenceHeight - radius
  ) {
    return false;
  }

  if (!CONFIG.collisions) {
    return true;
  }

  return !colliderPolygons.some(
    polygon => circleHitsPolygon(
      x,
      y,
      radius,
      polygon
    )
  );

}

/* ================================================================
   [JS 08] MOVIMENTO CON PICCOLI PASSI

   Divide gli spostamenti per evitare di saltare gli ostacoli.
   Permette di scorrere lungo le pareti.
   ================================================================ */

function movePlayer(dx, dy) {

  const steps = Math.max(
    1,
    Math.ceil(
      Math.max(
        Math.abs(dx),
        Math.abs(dy)
      ) / 2
    )
  );

  const stepX = dx / steps;
  const stepY = dy / steps;

  for (let i = 0; i < steps; i++) {

    if (canStand(player.x + stepX, player.y)) {
      player.x += stepX;
    }

    if (canStand(player.x, player.y + stepY)) {
      player.y += stepY;
    }

  }

}

/* ================================================================
   [JS 09] DIREZIONE DI RICCARDO

   In diagonale mantiene la direzione corrente quando
   le due componenti sono quasi uguali.
   ================================================================ */

function updateDirection(x, y) {

  const horizontal = Math.abs(x);
  const vertical = Math.abs(y);

  if (horizontal < 0.001 && vertical < 0.001) {
    return;
  }

  if (
    Math.abs(horizontal - vertical) < 0.12 &&
    horizontal > 0.001 &&
    vertical > 0.001
  ) {

    if (
      player.direction === "left" ||
      player.direction === "right"
    ) {

      player.direction = x > 0 ? "right" : "left";

    } else {

      player.direction = y > 0 ? "down" : "up";

    }

    return;

  }

  if (horizontal > vertical) {

    player.direction = x > 0 ? "right" : "left";

  } else {

    player.direction = y > 0 ? "down" : "up";

  }

}

/* ================================================================
   [JS 10] CAMERA CHE SEGUE RICCARDO
   ================================================================ */

function updateCamera() {

  const visibleWidth = viewWidth / CONFIG.zoom;
  const visibleHeight = viewHeight / CONFIG.zoom;

  camera.x = CONFIG.referenceWidth > visibleWidth
    ? clamp(
        player.x - visibleWidth / 2,
        0,
        CONFIG.referenceWidth - visibleWidth
      )
    : (CONFIG.referenceWidth - visibleWidth) / 2;

  camera.y = CONFIG.referenceHeight > visibleHeight
    ? clamp(
        player.y - visibleHeight / 2,
        0,
        CONFIG.referenceHeight - visibleHeight
      )
    : (CONFIG.referenceHeight - visibleHeight) / 2;

}

/* ================================================================
   [JS 11] DISEGNO DELLA MAPPA E DEBUG
   F2 mostra o nasconde le collisioni.
   ================================================================ */

function draw() {

  ctx.clearRect(0, 0, viewWidth, viewHeight);

  ctx.fillStyle = "#162b35";
  ctx.fillRect(0, 0, viewWidth, viewHeight);

  ctx.save();

  ctx.scale(CONFIG.zoom, CONFIG.zoom);
  ctx.translate(-camera.x, -camera.y);

  ctx.drawImage(
    mapImage,
    0,
    0,
    CONFIG.referenceWidth,
    CONFIG.referenceHeight
  );

  if (CONFIG.debug) {

    ctx.fillStyle = "#ff264a65";
    ctx.strokeStyle = "#ff7187";
    ctx.lineWidth = 1 / CONFIG.zoom;

    for (const polygon of colliderPolygons) {

      ctx.beginPath();

      polygon.forEach(function(point, index) {

        if (index === 0) {
          ctx.moveTo(point[0], point[1]);
        } else {
          ctx.lineTo(point[0], point[1]);
        }

      });

      ctx.closePath();
      ctx.fill();
      ctx.stroke();

    }

    ctx.beginPath();

    ctx.arc(
      player.x,
      player.y,
      CONFIG.collisionRadius,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = "#40ff94";
    ctx.fill();

  }

  ctx.restore();

  drawActor();

}

/* ================================================================
   [JS 12] TASTIERA: FRECCE E WASD
   ================================================================ */

const movementKeys = new Set([
  "arrowup",
  "arrowdown",
  "arrowleft",
  "arrowright",
  "w",
  "a",
  "s",
  "d"
]);

window.addEventListener("keydown", function(event) {

  const key = event.key.toLowerCase();

  if (movementKeys.has(key)) {

    event.preventDefault();

    keys.add(key);

  }

  if (key === "f2" && !event.repeat) {

    event.preventDefault();

    CONFIG.debug = !CONFIG.debug;

  }

});

window.addEventListener("keyup", function(event) {

  const key = event.key.toLowerCase();

  if (movementKeys.has(key)) {
    event.preventDefault();
  }

  keys.delete(key);

});

/* ================================================================
   [JS 13] JOYSTICK TOUCH E MOUSE
   ================================================================ */

function resetInput() {

  const pointer = joystickPointer;

  joystickPointer = null;

  keys.clear();

  analog.x = 0;
  analog.y = 0;

  player.moving = false;

  stick.style.transform = "";

  if (
    pointer !== null &&
    joystick.hasPointerCapture(pointer)
  ) {
    joystick.releasePointerCapture(pointer);
  }

}

function updateJoystick(event) {

  const rect = joystick.getBoundingClientRect();

  const limit = 38;

  let dx = event.clientX - (
    rect.left + rect.width / 2
  );

  let dy = event.clientY - (
    rect.top + rect.height / 2
  );

  const distance = Math.hypot(dx, dy);

  if (distance > limit) {

    dx *= limit / distance;
    dy *= limit / distance;

  }

  stick.style.transform =
    "translate(" + dx + "px, " + dy + "px)";

  const strength = Math.hypot(dx, dy) / limit;

  if (strength < 0.15) {

    analog.x = 0;
    analog.y = 0;

    return;

  }

  analog.x = dx / limit;
  analog.y = dy / limit;

}

joystick.addEventListener("pointerdown", function(event) {

  if (joystickPointer !== null) {
    return;
  }

  event.preventDefault();

  joystickPointer = event.pointerId;

  joystick.setPointerCapture(event.pointerId);

  updateJoystick(event);

});

joystick.addEventListener("pointermove", function(event) {

  if (event.pointerId === joystickPointer) {

    event.preventDefault();

    updateJoystick(event);

  }

});

[
  "pointerup",
  "pointercancel",
  "lostpointercapture"
].forEach(function(eventName) {

  joystick.addEventListener(eventName, function(event) {

    if (event.pointerId === joystickPointer) {
      resetInput();
    }

  });

});

window.addEventListener("blur", resetInput);

document.addEventListener("visibilitychange", function() {

  resetInput();

  lastTime = 0;

});

/* ================================================================
   [JS 14] TESTO DI STATO ED ERRORI DELLE IMMAGINI
   ================================================================ */

function updateStatus() {

  let message;

  if (failedAssets.size > 0) {

    message = "Missing image: " + [...failedAssets][0];

  } else {

    const atJobCenter = (
      player.x > 685 &&
      player.x < 840 &&
      player.y > 1390 &&
      player.y < 1480
    );

    message = atJobCenter
      ? "Job Center entrance · interior coming next"
      : "Map test · no battles";

  }

  if (statusText.textContent !== message) {
    statusText.textContent = message;
  }

}

/* ================================================================
   [JS 15] CICLO PRINCIPALE

   Cammina solo se la posizione cambia realmente.
   Quando rilasci i comandi o incontri una parete,
   mostra la posa ferma nell'ultima direzione.
   ================================================================ */

function tick(now) {

  const delta = lastTime
    ? Math.min((now - lastTime) / 1000, 0.04)
    : 0;

  lastTime = now;

  if (ready && !document.hidden) {

    let x = analog.x;
    let y = analog.y;

    if (keys.has("arrowright") || keys.has("d")) {
      x += 1;
    }

    if (keys.has("arrowleft") || keys.has("a")) {
      x -= 1;
    }

    if (keys.has("arrowdown") || keys.has("s")) {
      y += 1;
    }

    if (keys.has("arrowup") || keys.has("w")) {
      y -= 1;
    }

    const length = Math.hypot(x, y);

    if (length > 1) {

      x /= length;
      y /= length;

    }

    updateDirection(x, y);

    const previousX = player.x;
    const previousY = player.y;

    movePlayer(
      x * CONFIG.speed * delta,
      y * CONFIG.speed * delta
    );

    const movedX = player.x - previousX;
    const movedY = player.y - previousY;

    player.moving = Math.hypot(movedX, movedY) > 0.0001;

    if (player.moving) {

      // Se scorre lungo una parete, guarda dove sta andando.

      updateDirection(movedX, movedY);

    }

    updateCamera();

    draw();

    updateStatus();

  }

  requestAnimationFrame(tick);

}

/* ================================================================
   [JS 16] RITORNO ALLA STAZIONE
   ================================================================ */

function returnToStation() {

  player.x = CONFIG.start.x;
  player.y = CONFIG.start.y;

  player.direction = "down";
  player.moving = false;

  resetInput();

  updateCamera();

  if (ready) {
    draw();
  }

}

document.getElementById("resetButton").onclick =
  returnToStation;

/* ================================================================
   [JS 17] CARICAMENTO MAPPA ONLINE
   ================================================================ */

mapImage.onload = function() {

  ready = true;

  loading.hidden = true;

  resize();

  returnToStation();

};

mapImage.onerror = function() {

  ready = false;

  resetInput();

  loading.hidden = false;

  document.getElementById("loadingTitle").textContent =
    "Unable to load the map";

  document.getElementById("loadingText").textContent =
    "Check your connection and try again.";

  document.getElementById("retryLoad").hidden = false;

};

document.getElementById("retryLoad").onclick = function() {

  document.getElementById("loadingTitle").textContent =
    "Loading Seoul…";

  document.getElementById("loadingText").textContent =
    "Please wait.";

  this.hidden = true;

  const separator = CONFIG.map.includes("?") ? "&" : "?";

  mapImage.src =
    CONFIG.map +
    separator +
    "retry=" +
    Date.now();

};

/* ================================================================
   [JS 18] AVVIO
   ================================================================ */

loadActorAssets();

resize();

mapImage.src = CONFIG.map;

requestAnimationFrame(tick);

</script>

<script>
/* ================================================================
   [EDITOR 01] NUOVA MAPPA
   Il file deve essere nella stessa cartella di index.html.
   ================================================================ */

CONFIG.map =
  "file_00000000b7408209868184cc07238f4e.png";

ready = false;
loading.hidden = false;

mapImage.src = CONFIG.map;

/* ================================================================
   [EDITOR 02] SALVATAGGIO SEPARATO PER QUESTA MAPPA

   Non sovrascrive i dati locali della vecchia mappa.
   ================================================================ */

const EDITOR_STORAGE = "tarai-newmap-collisions-v1";

try {

  const saved = JSON.parse(
    localStorage.getItem(EDITOR_STORAGE)
  );

  if (validCollisionData(saved)) {
    colliderPolygons = saved;
  }

} catch (_) {}

function saveColliders() {

  try {

    localStorage.setItem(
      EDITOR_STORAGE,
      JSON.stringify(colliderPolygons)
    );

  } catch (_) {

    collisionHint.textContent =
      "Salvataggio non disponibile: usa Copia collisioni.";

  }

}

/* ================================================================
   [EDITOR 03] INTERFACCIA
   ================================================================ */

game.insertAdjacentHTML(
  "beforeend",
  '<button id="collisionOpen" type="button">' +
  'EDIT COLLISIONS</button>'
);

document.body.insertAdjacentHTML("beforeend", `
<section
  id="collisionEditor"
  hidden
  role="dialog"
  aria-modal="true"
  aria-label="Editor collisioni"
>

  <div id="collisionToolbar">

    <button type="button" data-editor-tool="pan">
      Sposta mappa
    </button>

    <button type="button" data-editor-tool="edit">
      Modifica
    </button>

    <button type="button" data-editor-tool="draw">
      Nuovo ostacolo
    </button>

    <button type="button" id="collisionFinish">
      Chiudi forma
    </button>

    <button type="button" id="collisionUndo">
      Annulla
    </button>

    <button type="button" id="collisionDelete">
      Elimina
    </button>

    <button type="button" id="collisionPlus">+</button>

    <button type="button" id="collisionMinus">−</button>

    <button type="button" id="collisionFit">
      Mappa intera
    </button>

    <button type="button" id="collisionCopy">
      Copia collisioni
    </button>

    <button type="button" id="collisionClose">
      Gioca
    </button>

  </div>

  <div id="collisionHint"></div>

  <div id="collisionView">
    <canvas id="collisionCanvas"></canvas>
  </div>

  <div id="collisionExport" hidden>

    <strong>Collisioni aggiornate</strong>

    <div>
      Copia questo blocco e aggiungilo dopo lo script
      dell’editor, prima di &lt;/body&gt;.
    </div>

    <textarea
      id="collisionData"
      readonly
      aria-label="Codice delle collisioni"
    ></textarea>

    <button id="collisionClipboard" type="button">
      Copia
    </button>

    <button id="collisionExportClose" type="button">
      Indietro
    </button>

  </div>

</section>
`);

/* ================================================================
   [EDITOR 04] STATO
   ================================================================ */

const collisionEditor =
  document.getElementById("collisionEditor");

const collisionCanvas =
  document.getElementById("collisionCanvas");

const collisionContext =
  collisionCanvas.getContext("2d");

const collisionView =
  document.getElementById("collisionView");

const collisionHint =
  document.getElementById("collisionHint");

let collisionTool = "pan";
let collisionSelected = -1;
let collisionDraft = [];
let collisionHistory = [];

let collisionScale = 1;

let collisionOffset = {
  x: 0,
  y: 0
};

let collisionDrag = null;
let collisionWasReady = false;

/* ================================================================
   [EDITOR 05] STORICO DELLE MODIFICHE
   ================================================================ */

function rememberColliders() {

  collisionHistory.push(
    JSON.stringify(colliderPolygons)
  );

  if (collisionHistory.length > 40) {
    collisionHistory.shift();
  }

}

/* ================================================================
   [EDITOR 06] DISEGNO DEGLI OSTACOLI
   ================================================================ */

function collisionPath(polygon) {

  const c = collisionContext;

  c.beginPath();

  polygon.forEach(function(point, index) {

    if (index === 0) {
      c.moveTo(point[0], point[1]);
    } else {
      c.lineTo(point[0], point[1]);
    }

  });

}

function paintColliders() {

  if (collisionEditor.hidden) {
    return;
  }

  const c = collisionContext;
  const w = collisionCanvas.width;
  const h = collisionCanvas.height;

  c.setTransform(1, 0, 0, 1, 0, 0);

  c.clearRect(0, 0, w, h);
  c.fillStyle = "#10232d";
  c.fillRect(0, 0, w, h);

  c.translate(
    collisionOffset.x,
    collisionOffset.y
  );

  c.scale(collisionScale, collisionScale);

  c.imageSmoothingEnabled = false;

  if (mapImage.complete && mapImage.naturalWidth) {

    c.drawImage(
      mapImage,
      0,
      0,
      CONFIG.referenceWidth,
      CONFIG.referenceHeight
    );

  }

  colliderPolygons.forEach(function(polygon, index) {

    const selected = index === collisionSelected;

    collisionPath(polygon);
    c.closePath();

    c.fillStyle = selected
      ? "#ffd66066"
      : "#ff244866";

    c.fill();

    c.strokeStyle = selected
      ? "#ffdd77"
      : "#ff425c";

    c.lineWidth = 1.5 / collisionScale;

    c.stroke();

    if (selected) {

      polygon.forEach(function(point) {

        const size = 10 / collisionScale;

        c.fillStyle = "white";

        c.fillRect(
          point[0] - size / 2,
          point[1] - size / 2,
          size,
          size
        );

      });

    }

  });

  if (collisionDraft.length) {

    collisionPath(collisionDraft);

    c.strokeStyle = "#70ffff";
    c.lineWidth = 2 / collisionScale;

    c.stroke();

    collisionDraft.forEach(function(point) {

      const size = 8 / collisionScale;

      c.fillStyle = "#70ffff";

      c.fillRect(
        point[0] - size / 2,
        point[1] - size / 2,
        size,
        size
      );

    });

  }

  // Il punto rappresenta i piedi di Riccardo.

  c.beginPath();
  c.arc(player.x, player.y, 7, 0, Math.PI * 2);
  c.fillStyle = "white";
  c.fill();

  c.beginPath();
  c.arc(player.x, player.y, 5, 0, Math.PI * 2);
  c.fillStyle = "#ed243b";
  c.fill();

  const help = {

    pan:
      "Trascina la mappa. Usa + e − per ingrandire.",

    edit:
      "Tocca un ostacolo rosso. Trascina i punti bianchi " +
      "o trascina il suo interno per spostarlo.",

    draw:
      "Tocca gli angoli intorno all’ostacolo, " +
      "poi premi Chiudi forma."

  };

  collisionHint.textContent =
    help[collisionTool] +
    " Ostacoli: " +
    colliderPolygons.length;

}

/* ================================================================
   [EDITOR 07] DIMENSIONI E ZOOM
   ================================================================ */

function resizeCollisionEditor(fit = false) {

  if (collisionEditor.hidden) {
    return;
  }

  collisionCanvas.width = Math.max(
    1,
    Math.round(collisionView.clientWidth)
  );

  collisionCanvas.height = Math.max(
    1,
    Math.round(collisionView.clientHeight)
  );

  if (fit) {

    collisionScale = Math.min(
      collisionCanvas.width / CONFIG.referenceWidth,
      collisionCanvas.height / CONFIG.referenceHeight
    ) * 0.97;

    collisionOffset.x = (
      collisionCanvas.width -
      CONFIG.referenceWidth * collisionScale
    ) / 2;

    collisionOffset.y = (
      collisionCanvas.height -
      CONFIG.referenceHeight * collisionScale
    ) / 2;

  }

  paintColliders();

}

new ResizeObserver(function() {
  resizeCollisionEditor();
}).observe(collisionView);

function collisionZoom(factor) {

  const x = collisionCanvas.width / 2;
  const y = collisionCanvas.height / 2;

  const worldX = (
    x - collisionOffset.x
  ) / collisionScale;

  const worldY = (
    y - collisionOffset.y
  ) / collisionScale;

  collisionScale = clamp(
    collisionScale * factor,
    0.12,
    5
  );

  collisionOffset.x = x - worldX * collisionScale;
  collisionOffset.y = y - worldY * collisionScale;

  paintColliders();

}

/* ================================================================
   [EDITOR 08] APERTURA E CHIUSURA

   Durante le modifiche il gioco viene fermato.
   ================================================================ */

document.getElementById("collisionOpen").onclick = function() {

  if (!ready) {
    return;
  }

  collisionWasReady = ready;

  ready = false;

  resetInput();

  collisionEditor.hidden = false;

  game.inert = true;

  requestAnimationFrame(function() {
    resizeCollisionEditor(true);
  });

};

document.getElementById("collisionClose").onclick = function() {

  if (collisionDraft.length) {

    collisionHint.textContent =
      "Chiudi la forma in corso oppure usa Annulla " +
      "per togliere i suoi punti.";

    return;

  }

  if (!canStand(player.x, player.y)) {

    collisionHint.textContent =
      "Il punto di Riccardo è dentro un ostacolo. " +
      "Correggi quell’ostacolo prima di giocare.";

    return;

  }

  saveColliders();

  collisionEditor.hidden = true;

  game.inert = false;

  ready = collisionWasReady;

  lastTime = 0;

  resetInput();

  document.getElementById("collisionOpen").focus();

};

window.addEventListener("keydown", function(event) {

  if (
    !collisionEditor.hidden &&
    movementKeys.has(event.key.toLowerCase())
  ) {

    event.preventDefault();
    event.stopImmediatePropagation();

  }

}, true);

/* ================================================================
   [EDITOR 09] SELEZIONE DEGLI STRUMENTI
   ================================================================ */

document.querySelectorAll(
  "[data-editor-tool]"
).forEach(function(button) {

  button.onclick = function() {

    collisionTool = button.dataset.editorTool;

    document.querySelectorAll(
      "[data-editor-tool]"
    ).forEach(function(other) {

      other.classList.toggle(
        "active",
        other === button
      );

    });

    paintColliders();

  };

});

document.querySelector(
  '[data-editor-tool="pan"]'
).classList.add("active");

document.getElementById("collisionPlus").onclick = function() {
  collisionZoom(1.3);
};

document.getElementById("collisionMinus").onclick = function() {
  collisionZoom(1 / 1.3);
};

document.getElementById("collisionFit").onclick = function() {
  resizeCollisionEditor(true);
};

/* ================================================================
   [EDITOR 10] ANNULLAMENTO E CANCELLAZIONE
   ================================================================ */

document.getElementById("collisionUndo").onclick = function() {

  if (collisionDraft.length) {

    collisionDraft.pop();

  } else if (collisionHistory.length) {

    colliderPolygons = JSON.parse(
      collisionHistory.pop()
    );

    collisionSelected = -1;

    saveColliders();

  }

  paintColliders();

};

document.getElementById("collisionDelete").onclick = function() {

  if (collisionSelected < 0) {
    return;
  }

  rememberColliders();

  colliderPolygons.splice(collisionSelected, 1);

  collisionSelected = -1;

  saveColliders();

  paintColliders();

};

/* ================================================================
   [EDITOR 11] CONTROLLO DELLE FORME

   Impedisce di creare contorni incrociati o senza superficie.
   ================================================================ */

function collisionSelfIntersects(polygon) {

  function orient(a, b, c) {

    return (
      (b[0] - a[0]) * (c[1] - a[1]) -
      (b[1] - a[1]) * (c[0] - a[0])
    );

  }

  for (let i = 0; i < polygon.length; i++) {

    for (let j = i + 1; j < polygon.length; j++) {

      if (
        j === i + 1 ||
        (i === 0 && j === polygon.length - 1)
      ) {
        continue;
      }

      const a = polygon[i];
      const b = polygon[(i + 1) % polygon.length];

      const c = polygon[j];
      const d = polygon[(j + 1) % polygon.length];

      const crossA = (
        orient(a, b, c) * orient(a, b, d) <= 0
      );

      const crossB = (
        orient(c, d, a) * orient(c, d, b) <= 0
      );

      const overlapX = (
        Math.max(
          Math.min(a[0], b[0]),
          Math.min(c[0], d[0])
        ) <=
        Math.min(
          Math.max(a[0], b[0]),
          Math.max(c[0], d[0])
        )
      );

      const overlapY = (
        Math.max(
          Math.min(a[1], b[1]),
          Math.min(c[1], d[1])
        ) <=
        Math.min(
          Math.max(a[1], b[1]),
          Math.max(c[1], d[1])
        )
      );

      if (crossA && crossB && overlapX && overlapY) {
        return true;
      }

    }

  }

  return false;

}

function collisionValid(polygon) {

  if (polygon.length < 3) {
    return false;
  }

  const area = Math.abs(
    polygon.reduce(function(total, point, index) {

      const next = polygon[
        (index + 1) % polygon.length
      ];

      return (
        total +
        point[0] * next[1] -
        next[0] * point[1]
      );

    }, 0)
  ) / 2;

  return (
    area > 3 &&
    !collisionSelfIntersects(polygon)
  );

}

/* ================================================================
   [EDITOR 12] CHIUSURA DI UN NUOVO OSTACOLO
   ================================================================ */

document.getElementById("collisionFinish").onclick = function() {

  if (!collisionValid(collisionDraft)) {

    collisionHint.textContent =
      "Servono almeno 3 punti. " +
      "Il contorno non deve incrociarsi.";

    return;

  }

  rememberColliders();

  colliderPolygons.push(collisionDraft);

  collisionSelected = colliderPolygons.length - 1;

  collisionDraft = [];

  saveColliders();

  paintColliders();

};

/* ================================================================
   [EDITOR 13] CONVERSIONE DELLE COORDINATE
   ================================================================ */

function collisionPointer(event) {

  const rect = collisionCanvas.getBoundingClientRect();

  return {

    x:
      (event.clientX - rect.left) *
      collisionCanvas.width / rect.width,

    y:
      (event.clientY - rect.top) *
      collisionCanvas.height / rect.height

  };

}

function collisionWorld(point) {

  return [

    Math.round(clamp(
      (point.x - collisionOffset.x) / collisionScale,
      0,
      CONFIG.referenceWidth
    )),

    Math.round(clamp(
      (point.y - collisionOffset.y) / collisionScale,
      0,
      CONFIG.referenceHeight
    ))

  ];

}

/* ================================================================
   [EDITOR 14] TOCCO: DISEGNO E SELEZIONE
   ================================================================ */

collisionCanvas.onpointerdown = function(event) {

  if (collisionDrag) {
    return;
  }

  event.preventDefault();

  collisionCanvas.setPointerCapture(event.pointerId);

  const point = collisionPointer(event);
  const world = collisionWorld(point);

  if (collisionTool === "draw") {

    const previous = collisionDraft[
      collisionDraft.length - 1
    ];

    if (
      !previous ||
      Math.hypot(
        world[0] - previous[0],
        world[1] - previous[1]
      ) > 2
    ) {
      collisionDraft.push(world);
    }

    paintColliders();

    return;

  }

  if (collisionTool === "pan") {

    collisionDrag = {
      id: event.pointerId,
      kind: "pan",
      point,
      offset: {...collisionOffset}
    };

    return;

  }

  if (collisionSelected >= 0) {

    const vertex = colliderPolygons[
      collisionSelected
    ].findIndex(function(value) {

      return Math.hypot(
        value[0] - world[0],
        value[1] - world[1]
      ) < 16 / collisionScale;

    });

    if (vertex >= 0) {

      collisionDrag = {
        id: event.pointerId,
        kind: "vertex",
        vertex,
        before: JSON.stringify(colliderPolygons)
      };

      return;

    }

  }

  collisionSelected = -1;

  for (let i = colliderPolygons.length - 1; i >= 0; i--) {

    if (
      pointInPolygon(
        world[0],
        world[1],
        colliderPolygons[i]
      )
    ) {

      collisionSelected = i;

      break;

    }

  }

  if (collisionSelected >= 0) {

    collisionDrag = {

      id: event.pointerId,

      kind: "shape",

      point: world,

      before: JSON.stringify(colliderPolygons),

      original: colliderPolygons[
        collisionSelected
      ].map(value => [...value])

    };

  }

  paintColliders();

};

/* ================================================================
   [EDITOR 15] TRASCINAMENTO MAPPA, PUNTI E OSTACOLI
   ================================================================ */

collisionCanvas.onpointermove = function(event) {

  const drag = collisionDrag;

  if (!drag || drag.id !== event.pointerId) {
    return;
  }

  const point = collisionPointer(event);
  const world = collisionWorld(point);

  if (drag.kind === "pan") {

    collisionOffset.x =
      drag.offset.x + point.x - drag.point.x;

    collisionOffset.y =
      drag.offset.y + point.y - drag.point.y;

  } else if (drag.kind === "vertex") {

    colliderPolygons[
      collisionSelected
    ][drag.vertex] = world;

  } else {

    const minX = Math.min(
      ...drag.original.map(value => value[0])
    );

    const maxX = Math.max(
      ...drag.original.map(value => value[0])
    );

    const minY = Math.min(
      ...drag.original.map(value => value[1])
    );

    const maxY = Math.max(
      ...drag.original.map(value => value[1])
    );

    const dx = clamp(
      world[0] - drag.point[0],
      -minX,
      CONFIG.referenceWidth - maxX
    );

    const dy = clamp(
      world[1] - drag.point[1],
      -minY,
      CONFIG.referenceHeight - maxY
    );

    colliderPolygons[collisionSelected] =
      drag.original.map(function(value) {

        return [
          value[0] + dx,
          value[1] + dy
        ];

      });

  }

  paintColliders();

};

/* ================================================================
   [EDITOR 16] FINE DEL TRASCINAMENTO
   ================================================================ */

function endCollisionDrag(event) {

  const drag = collisionDrag;

  if (!drag || drag.id !== event.pointerId) {
    return;
  }

  if (drag.before) {

    const cancelled = event.type === "pointercancel";

    const valid = collisionValid(
      colliderPolygons[collisionSelected]
    );

    if (cancelled || !valid) {

      colliderPolygons = JSON.parse(drag.before);

    } else if (
      drag.before !== JSON.stringify(colliderPolygons)
    ) {

      collisionHistory.push(drag.before);

      if (collisionHistory.length > 40) {
        collisionHistory.shift();
      }

      saveColliders();

    }

  }

  collisionDrag = null;

  paintColliders();

}

collisionCanvas.onpointerup = endCollisionDrag;

collisionCanvas.onpointercancel = endCollisionDrag;

collisionCanvas.onlostpointercapture = endCollisionDrag;
