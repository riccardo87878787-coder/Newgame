<style>
/* 01 · SCHERMO E LIVELLI */

/* 02 · INTERFACCIA */

#stick{position:absolute;left:33px;top:33px;width:42px;height:42px;border:2px solid #ffffff99;border-radius:50%;background:#dfedf0bb}

/* 05 · BALLOON PNG E COMPARSA ANIMATA */
#interactions{position:absolute;inset:0;z-index:7;pointer-events:none}
.marker{position:absolute;pointer-events:auto;width:48px;height:48px;min-width:48px;min-height:48px;padding:0;transform:translate(-50%,-100%);background:none;border:0;box-shadow:none}

.appear{animation:balloonPop .24s cubic-bezier(.2,.8,.3,1.25) both}
@keyframes balloonPop{0%{opacity:0;transform:translateY(7px) scale(.72)}75%{opacity:1;transform:translateY(-2px) scale(1.04)}100%{opacity:1;transform:translateY(0) scale(1)}}
#speech{position:absolute;z-index:9;width:310px;max-width:calc(100% - 20px);min-height:116px;padding:5px 7px 17px;border-style:solid;border-color:transparent;border-width:14px 20px 24px;border-image-source:url("icons/Balloon_dialogo.png");border-image-slice:70 100 110 fill;border-image-width:14px 20px 24px;border-image-repeat:stretch;background:none;border-radius:0;box-shadow:none;color:#000;font-family:Arial,"Noto Sans KR",sans-serif;font-size:18px;font-weight:700;line-height:1.5;text-align:left;word-break:keep-all;overflow-wrap:anywhere;touch-action:manipulation;transform-origin:center bottom}
#speechText{position:relative;z-index:1;color:#000;font-weight:700}
#reaction{position:absolute;z-index:8;width:48px;height:46px;pointer-events:none;transform:translate(-50%,-100%)}
#reaction img{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
@media(prefers-reduced-motion:reduce){.appear{animation:none}}
/* 22 · MENU MODULARE E TRANSIZIONI */
.marker img{width:32px;height:32px;margin:8px auto}.marker{width:44px;height:44px;min-width:44px;min-height:44px}#reaction{width:32px;height:32px}
#fade{position:absolute;inset:0;background:#000;z-index:30;opacity:0;pointer-events:none;transition:opacity .75s}#fade.black{opacity:1}
#menuOpen{position:absolute;right:12px;top:70px;z-index:6;font-weight:800}
#rpgMenu{position:absolute;inset:0;z-index:15;background:#252727 url('Menu/file_000000005b24820982b541d5471f75b7.png') center/100% 100%;color:#282825;font-family:Arial,'Noto Sans KR',sans-serif;font-weight:800}
#partySlots{position:absolute;left:2%;top:4%;width:65%;height:92%;display:grid;grid-template-rows:repeat(4,minmax(0,1fr))}.party-slot{min-height:0;position:relative;padding:2% 0}.member-card{position:absolute;inset:3% 0;background:#f5e8cf;border:1px solid #bc9853;border-radius:8px;overflow:hidden}.member-card>img{width:100%;height:100%;object-fit:fill}.member-data{position:absolute;left:45%;right:4%;top:9%;bottom:8%;display:flex;flex-direction:column;justify-content:space-evenly;font-size:clamp(10px,2.7vw,15px)}.member-data strong{font-size:1.3em}.stat-row{white-space:nowrap}.meter{height:5px;background:#d6cbb8;border-radius:5px;overflow:hidden}.meter span{display:block;height:100%;background:#326368}.meter.ep span{background:#b28233}
#menuNav{position:absolute;left:69%;right:2%;top:7%;bottom:20%;display:flex;flex-direction:column;justify-content:space-evenly}#menuNav button{background:none;border:0;color:#f5ead5;font-weight:800;font-size:clamp(13px,3.8vw,21px);padding:5px 0}#wallet{position:absolute;left:69%;right:2%;bottom:6%;text-align:center;color:#f5ead5;font-size:clamp(13px,3.5vw,20px);font-variant-numeric:tabular-nums}#menuClose{position:absolute;right:3%;bottom:1%;background:none;color:#f5ead5;border:0;font-weight:800}
#languagePage{position:absolute;inset:2%;background:#252727;border:1px solid #bf9953;padding:10% 5%;color:#f5ead5}#languagePage h2{text-align:center;font-size:28px}#languageChoices{background:#f5e8cf;border-radius:10px;padding:25px 12px;margin-top:30px;display:grid;gap:20px}#languageChoices button,#languageBack{background:#f5e8cf;color:#242725;border:1px solid #977747;font-size:22px;font-weight:800;min-height:65px}#languageChoices button[aria-pressed='true']{outline:3px solid #b48b43}#languageBack{display:block;margin:30px auto 0;padding:8px 30px}#rpgMenu.auto button{pointer-events:none}.auto-focus{box-shadow:0 0 0 3px #caa55b!important}#speech.thought{border-image-source:url('icons/file_000000006f608209b1c6d6380111193e.png');border-bottom-width:40px;border-image-width:14px 20px 40px}#speech.narration{border-image:none;background:#fff5df;border:2px solid #8b9297;border-radius:8px;padding:18px}

/* 28 · INVENTARIO E DESTINAZIONI: DATI E TESTI DINAMICI */
#inventoryPage{position:absolute;inset:2%;padding:22px;background:#f5e8cf;color:#252727;border:2px solid #bd9853;display:flex;flex-direction:column;gap:16px;font-weight:800}

#destinationSkin{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#destinationTitle{position:absolute;left:7%;right:7%;top:5%;margin:0;text-align:center;color:#fff4de;font-size:clamp(18px,5vw,27px)}
#destinationList{position:absolute;left:9%;right:9%;top:19%;bottom:17%;display:flex;flex-direction:column;gap:10px;overflow:auto;touch-action:pan-y}
#destinationList button{flex:1;min-height:46px;border:1px solid #b99a60;background:#fff5dfdd;color:#252727;font-weight:800;font-size:18px;text-align:left;padding:10px 16px}#destinationList button:disabled{opacity:.65;color:#6f6e66}
#destinationBack{position:absolute;bottom:5.5%;left:15%;width:70%;height:7%;border:0;background:#272929;color:#fff4de;font-size:20px;font-weight:800}
#game.travel-ending #resetButton{position:relative;z-index:41}#game.travel-ending #hud{z-index:41}#game.travel-ending .panel{visibility:hidden}
</style>
<style>

<style>
/* PRIMO COMBATTIMENTO · area di battaglia 2/3, comandi 1/3 */
#battleScreen{position:absolute;inset:0;z-index:35;background:#03091e;color:#fff3d8;font-family:Georgia,serif;container-type:size;isolation:isolate}
#battleBackground{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;opacity:0;transition:opacity .75s;image-rendering:pixelated;pointer-events:none}
#battleScreen.background-in #battleBackground{opacity:1}
#battleStage{position:absolute;inset:0 0 auto;height:66.666667%;opacity:0;transition:opacity .55s}
#battleScreen.fighters-in #battleStage{opacity:1}
.battle-fighter{position:absolute;transform:translate(-50%,-100%);padding:0;border:0;background:none;border-radius:0;min-width:0;min-height:0;overflow:visible;touch-action:manipulation;transition:opacity .3s;outline:none;cursor:default}
.battle-fighter:disabled{opacity:1}
.battle-fighter img{position:absolute;max-width:none;max-height:none;pointer-events:none;image-rendering:pixelated}
.battle-fighter:focus-visible{outline:1px dashed #fff8;outline-offset:3px}
#battleScreen.choosing-target .battle-fighter{cursor:pointer}
.battle-fighter.defeated{opacity:0;pointer-events:none}
.battle-damage{position:absolute;z-index:5;font:bold 5cqw monospace;color:#fff;text-shadow:2px 2px #220b12;pointer-events:none;animation:battleDamage .75s ease-out forwards;transform:translate(-50%,-100%)}
@keyframes battleDamage{0%{opacity:1;translate:0 0}75%{opacity:1}100%{opacity:0;translate:0 -22px}}
#battleMenu{position:absolute;left:1.5%;right:1.5%;top:67.5%;bottom:1.5%;display:grid;grid-template-columns:44% 56%;padding:4px;border:3px double #aac7e6;outline:1px solid #324868;background:linear-gradient(110deg,#060d29,#02071a);box-shadow:inset 0 0 0 1px #283858;opacity:0;transition:opacity .3s}
#battleScreen.menu-in #battleMenu{opacity:1}
#battleStatus{min-width:0;padding:7% 5%;border-right:3px double #aac7e6}
#battleName{display:block;font-size:4.2cqw;letter-spacing:.04em;margin-bottom:12%;overflow-wrap:anywhere}
.battle-stat{display:grid;grid-template-columns:19% 1fr;align-items:center;gap:3%;margin:9% 0;font-weight:bold;font-size:3.5cqw}
.battle-meter{height:3.8cqh;min-height:15px;position:relative;border:3px double #adc9e9;background:#111b30;overflow:hidden}
.battle-meter-fill{height:100%;background:linear-gradient(#82f343,#23cc08);transition:width .25s}
.battle-meter.ep .battle-meter-fill{background:linear-gradient(#40c5ff,#0068f5)}
.battle-meter-value{position:absolute;inset:0;display:grid;place-items:center;color:white;font:bold 2.8cqw monospace;text-shadow:1px 1px #000,-1px -1px #000,1px -1px #000,-1px 1px #000}
#battleHint{margin:12% 0 0;font:2.6cqw/1.4 Arial,sans-serif;color:#c2cee3;min-height:3em}
#battleCommands{display:grid;grid-template-rows:repeat(5,minmax(0,1fr));gap:3%;padding:3% 3% 3% 4%;min-height:0}
#battleCommands button{position:relative;min-height:0;min-width:0;padding:0 8% 0 16%;border:3px double #8ba7cb;border-radius:0;text-align:left;font:bold 4.4cqw Georgia,serif;letter-spacing:.04em;background:linear-gradient(100deg,#09132e,#03081c);color:#fff3d8;touch-action:manipulation}
#battleCommands button:disabled{opacity:1;color:#687184;border-color:#465370;cursor:default}
#battleCommands button.available{border-color:#f5cf55;background:linear-gradient(90deg,#084a88,#061b45)}

#battleCommands button.cancel-target{font-size:3.5cqw}
#battleResult{position:absolute;inset:0;z-index:8;background:#02061766;display:grid;place-content:center;text-align:center;gap:14px;padding:12%;font-size:5cqw}

#battleResult p{font:3.5cqw/1.5 Arial,sans-serif;margin:0}
#battleResult button{font:bold 4cqw Georgia,serif;border-radius:0;border:3px double #c8d9ee;background:#071d3e;touch-action:manipulation}
#battleVortex{position:absolute;inset:0;z-index:34;background:#000;display:none;pointer-events:none}
#battleVortex.closing{display:block}

#game.battle-entering #hud,#game.battle-entering #sideControls,#game.battle-entering #menuOpen,#game.battle-active #hud,#game.battle-active #sideControls,#game.battle-active #menuOpen,#game.battle-active #testHongdeonButton{visibility:hidden}
.battle-impact{position:absolute;z-index:4;width:42px;height:42px;pointer-events:none;image-rendering:pixelated;transform:translate(-50%,-50%);animation:battleImpact .2s steps(3,end) forwards}
@keyframes battleImpact{0%{opacity:1;scale:.65}45%{opacity:1;scale:1.1}100%{opacity:0;scale:.9}}
@media(prefers-reduced-motion:reduce){.battle-damage{animation-duration:.1s}}

/* PRIMO SERVIZIO · montaggio, notte e incontro sulla mappa */
#dinnerMontage{position:absolute;inset:0;z-index:32;background:#000;display:grid;place-items:center;pointer-events:auto}

</style>

<body>
<!-- 05 · HTML -->
<main id="game">
  <div id="scene" aria-hidden="true">
    <img id="map" alt="" draggable="false">
    <div id="trainWindow"><img id="train" alt="" draggable="false"></div>
  </div>
  <div id="hud">
    <div class="panel"><div class="eyebrow">PROLOGUE · SEOUL</div><div id="objective">Find the Job Center</div><div id="status" aria-live="polite">Map test · no battles</div></div>
    <button id="resetButton" aria-label="Ricomincia introduzione">↺</button>

function loadAsset(file,fixed=false,child=false){
 const key=file+"|"+fixed+"|"+child;if(cache.has(key))return cache.get(key);
 const promise=new Promise(resolve=>{
  const image=new Image();image.onload=()=>{
   const w=image.naturalWidth,h=image.naturalHeight;
   let b={x:0,y:0,w,h},freeze=null;
   try{
    const c=document.createElement("canvas");c.width=w;c.height=h;
    const ctx=c.getContext("2d",{willReadFrequently:true});ctx.drawImage(image,0,0);
    freeze=c.toDataURL("image/png");
    if(!fixed){
     const data=ctx.getImageData(0,0,w,h).data;let l=w,t=h,r=-1,d=-1;
     for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(data[(y*w+x)*4+3]>=100){l=Math.min(l,x);r=Math.max(r,x);t=Math.min(t,y);d=Math.max(d,y);}
     if(r>=l)b={x:l,y:t,w:r-l+1,h:d-t+1};
    }
   }catch(_){}
   missing.delete(file);resolve({key,file,image,b,fixed,body:child?236:280,foot:fixed?h*292/304:b.y+b.h,freeze});
  };
  image.onerror=()=>{missing.add(file);resolve(null);};image.src=file;
 });cache.set(key,promise);return promise;
}
function createActor(height=54,width=null){
 const node=document.createElement("div");node.className="actor";node.hidden=true;scene.appendChild(node);

}
function setAsset(actor,asset,paused=false){
 if(!asset)return;if(actor.active===asset&&actor.paused===paused){actor.node.hidden=false;return;}
 const key=asset.key+(paused&&asset.freeze?"|pause":"");let image=actor.images.get(key);
 if(!image){image=document.createElement("img");image.src=paused&&asset.freeze?asset.freeze:asset.file;image.alt="";image.draggable=false;actor.images.set(key,image);actor.node.appendChild(image);}
 for(const im of actor.images.values())im.hidden=im!==image;
 const b=asset.b,scale=actor.width?actor.width/b.w:actor.height/(asset.fixed?asset.body:b.h);
 const originX=asset.fixed?asset.image.naturalWidth/2:b.x+b.w/2;
 image.style.width=asset.image.naturalWidth*scale+"px";image.style.height=asset.image.naturalHeight*scale+"px";
 image.style.left=-originX*scale+"px";image.style.top=-asset.foot*scale+"px";
 actor.visibleHeight=(asset.foot-b.y)*scale;actor.active=asset;actor.paused=paused;actor.node.hidden=false;
}

const beginBeforeDinner=beginIntro;
beginIntro=function(){storyEpoch++;storyPhase='before-service';storyBusy=false;storyNight=false;workUniformEnabled=false;storyDistance=0;storyLastPosition=null;storyCamera=null;storyEncounter=null;if(storyEnemy){storyEnemy.actor.node.remove();storyEnemy=null;}dinnerMontage.hidden=true;hungryCall.hidden=true;storyNightLighting.hidden=true;scene.classList.remove('story-night');game.classList.remove('story-busy');beginBeforeDinner();};
window.TaraiStory={getState:()=>({phase:storyPhase,night:storyNight,uniform:workUniformEnabled,distance:storyDistance,enemy:storyEnemy?{x:storyEnemy.x,y:storyEnemy.y,moving:storyEnemy.moving}:null}),retryService:()=>{if(storyPhase==='montage-error')void startDinnerMontage();}};


/* 21 · AVVIO */
let loadingMap=false,assetsStarted=false;
async function startGame(retry=false){
 if(loadingMap)return;loadingMap=true;ready=false;resetInput();$("loading").hidden=false;$("loadingTitle").textContent="Loading Seoul…";$("loadingText").textContent="Please wait.";$("retryLoad").hidden=true;
 try{
  await new Promise((resolve,reject)=>{mapImage.onload=resolve;mapImage.onerror=reject;mapImage.src=CONFIG.map+(retry?"?retry="+Date.now():"");});
  if(!assetsStarted){assetsStarted=true;await Promise.all([loadCharacters(),loadVehicles()]);setupTrain();}
  await balloonSkinsReady;
  rebuildDepth();for(const n of npcs){nearestFree(n);drawNpc(n);}ready=true;$("loading").hidden=true;resize();beginIntro();
 }catch(_){$("loadingTitle").textContent="Unable to load the map";$("loadingText").textContent="Controlla il nome della mappa e la sua posizione accanto a index.html.";$("retryLoad").hidden=false;}finally{loadingMap=false;}
}
$("retryLoad").onclick=()=>startGame(true);resize();startGame();requestAnimationFrame(tick);
</script>
