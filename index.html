   [CSS 01] SCHERMO VERTICALE

* { box-sizing: border-box; }

  }
}

}

#foreground {

}

#objective { font-size: 12px; }

#resetButton {

/* ================================================================
   [CSS 04] CROCE DIREZIONALE

/* ================================================================
   [DATA 03] SALVATAGGIO E VERSIONE

   Nuova chiave: non importa collisioni obsolete dal vecchio file.
   Modifica la versione quando distribuisci nuovi dati definitivi.
   ================================================================ */

const DATA_VERSION = "seoul-depth-2026-11-05-01";
const STORAGE_KEY = "tarai-rpg-world-v3";

const clone = value => JSON.parse(JSON.stringify(value));

function validPolygon(p) {
  return (
    Array.isArray(p) && p.length >= 3 &&
    p.every(v =>
      Array.isArray(v) && v.length === 2 &&
      v.every(Number.isFinite)
    )
  );
}

function validWorld(data) {
  return (
    data &&
    Array.isArray(data.collisions) &&
    data.collisions.every(validPolygon) &&
    Array.isArray(data.depth) &&
    data.depth.every(zone =>
      zone &&
      Number.isFinite(zone.baseY) &&
      validPolygon(zone.polygon)
    )
  );
}

let world = {
  collisions: clone(DEFAULT_COLLISIONS),
  depth: clone(DEFAULT_DEPTH)
};

try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));

  if (
    saved &&
    saved.version === DATA_VERSION &&
    validWorld(saved.world)
  ) {
    world = saved.world;
  }
} catch (_) {}

let storageFailed = false;

function saveWorld() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      version: DATA_VERSION,
      world
    }));
    storageFailed = false;
  } catch (_) {

  }
}

/* ================================================================

      asset.loaded = false;
      failedAssets.add(settings.file);
    };

    assets[mode][direction] = asset;
    actorLayer.appendChild(image);

    image.src = settings.file;
  }
}

function getActorAsset() {
  const mode = player.moving ? "walk" : "idle";

  const candidates = [
    assets[mode][player.direction],
    assets.idle[player.direction],
    assets.idle.down
  ];

  return candidates.find(asset => asset.loaded) || null;
}

/* ================================================================
   [JS 03] COLLISIONI CERCHIO / POLIGONO
   ================================================================ */

function pointInPolygon(x, y, polygon) {
  let inside = false;

  for (
    let i = 0, j = polygon.length - 1;
    i < polygon.length;
    j = i++
  ) {
    const [xi, yi] = polygon[i];
    const [xj, yj] = polygon[j];

    if (
      (yi > y) !== (yj > y) &&
      x < (xj - xi) * (y - yi) / (yj - yi) + xi
    ) {
      inside = !inside;
    }
  }

  return inside;
}

function segmentDistanceSquared(x, y, a, b) {
  const dx = b[0] - a[0];
  const dy = b[1] - a[1];
  const length = dx * dx + dy * dy;

  const t = length
    ? clamp(
        ((x-a[0])*dx + (y-a[1])*dy) / length,
        0,
        1
      )
    : 0;

  return (
    (x-a[0]-t*dx) ** 2 +
    (y-a[1]-t*dy) ** 2
  );
}

function circleHitsPolygon(x, y, radius, polygon) {
  if (pointInPolygon(x, y, polygon)) return true;

  return polygon.some((a, i) =>
    segmentDistanceSquared(
      x, y, a, polygon[(i+1) % polygon.length]
    ) <= radius * radius
  );
}

function canStand(x, y) {
  const r = CONFIG.radius;

  if (
    x < r || y < r ||
    x > CONFIG.width-r ||
    y > CONFIG.height-r
  ) return false;

  return !CONFIG.collisions || !world.collisions.some(
    p => circleHitsPolygon(x, y, r, p)

}

  const steps = Math.max(
    1,
    Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 2)
  );

  for (let i = 0; i < steps; i++) {
    if (canStand(player.x + dx/steps, player.y)) {
      player.x += dx/steps;
    }

    if (canStand(player.x, player.y + dy/steps)) {
      player.y += dy/steps;
    }
  }
}

/* ================================================================
   [JS 04] MOVIMENTO SOLO IN QUATTRO DIREZIONI

   Se tieni premuti più comandi, vince l'ultimo.
   Non vengono mai sommate due direzioni.
   ================================================================ */

const DIRECTIONS = {
  up:    { x: 0, y: -1 },
  down:  { x: 0, y: 1 },
  left:  { x: -1, y: 0 },
  right: { x: 1, y: 0 }
};

const KEY_DIRECTION = {
  arrowup: "up", w: "up",
  arrowdown: "down", s: "down",
  arrowleft: "left", a: "left",
  arrowright: "right", d: "right"
};

const heldInputs = new Map();

function pressInput(token, direction) {
  heldInputs.delete(token);
  heldInputs.set(token, direction);
  updateButtons();
}

function releaseInput(token) {
  heldInputs.delete(token);
  updateButtons();
}

function currentDirection() {
  const list = [...heldInputs.values()];
  return list[list.length-1] || null;
}

function updateButtons() {
  const direction = currentDirection();

  document.querySelectorAll("#dpad button").forEach(button => {
    button.classList.toggle(
      "pressed",
      button.dataset.direction === direction
    );
  });
}

function resetInput() {
  heldInputs.clear();
  player.moving = false;
  updateButtons();
}

window.addEventListener("keydown", event => {
  const key = event.key.toLowerCase();
  const direction = KEY_DIRECTION[key];

  if (!direction) return;

  // Le frecce devono funzionare normalmente nel testo esportato.
  if (!$("exportPanel").hidden) return;

  event.preventDefault();

  if (!editorState.open && !event.repeat) {
    pressInput("key:" + key, direction);
  }
});

window.addEventListener("keyup", event => {
  releaseInput("key:" + event.key.toLowerCase());
});

document.querySelectorAll("#dpad button").forEach(button => {
  button.addEventListener("pointerdown", event => {
    if (editorState.open || !ready) return;

    event.preventDefault();
    button.setPointerCapture(event.pointerId);

    pressInput(
      "pointer:" + event.pointerId,
      button.dataset.direction
    );
  });

  for (const name of [
    "pointerup", "pointercancel", "lostpointercapture"
  ]) {
    button.addEventListener(name, event => {
      releaseInput("pointer:" + event.pointerId);
    });
  }
});

window.addEventListener("blur", resetInput);

document.addEventListener("visibilitychange", () => {
  resetInput();
  lastTime = 0;
});

/* ================================================================
   [JS 05] CAMERA E RIDIMENSIONAMENTO
   ================================================================ */

function updateCamera() {
  const w = viewWidth / gameZoom;
  const h = viewHeight / gameZoom;

  camera.x = CONFIG.width > w
    ? clamp(player.x-w/2, 0, CONFIG.width-w)
    : (CONFIG.width-w)/2;

  camera.y = CONFIG.height > h
    ? clamp(player.y-h/2, 0, CONFIG.height-h)
    : (CONFIG.height-h)/2;
}

function resize() {
  const r = game.getBoundingClientRect();

  viewWidth = Math.max(1, r.width);
  viewHeight = Math.max(1, r.height);
  density = Math.min(window.devicePixelRatio || 1, 2);

  for (const layer of [canvas, foreground]) {
    layer.width = Math.round(viewWidth*density);
    layer.height = Math.round(viewHeight*density);
  }

  updateCamera();

  if (ready) drawGame();
}

new ResizeObserver(resize).observe(game);

$("zoomIn").onclick = () => {
  gameZoom = clamp(gameZoom+0.2, CONFIG.minZoom, CONFIG.maxZoom);
  updateCamera();
};

$("zoomOut").onclick = () => {
  gameZoom = clamp(gameZoom-0.2, CONFIG.minZoom, CONFIG.maxZoom);
  updateCamera();
};

/* ================================================================
   [JS 06] DISEGNO MAPPA E SPRITE
   ================================================================ */

function prepareWorldContext(context) {
  context.setTransform(density, 0, 0, density, 0, 0);
  context.clearRect(0, 0, viewWidth, viewHeight);
  context.imageSmoothingEnabled = false;

  context.scale(gameZoom, gameZoom);
  context.translate(-camera.x, -camera.y);
}

function polygonPath(context, polygon) {
  context.beginPath();

  polygon.forEach((point, index) => {
    if (!index) context.moveTo(point[0], point[1]);
    else context.lineTo(point[0], point[1]);
  });

  context.closePath();
}

function drawActor() {
  const asset = getActorAsset();

  if (activeAsset !== asset) {
    if (activeAsset) activeAsset.image.style.display = "none";

    activeAsset = asset;

    if (activeAsset) activeAsset.image.style.display = "block";
  }

  if (!asset) return;

  asset.image.style.height = (
    CONFIG.spriteHeight * asset.settings.scale * gameZoom
  ) + "px";

  asset.image.style.left =
    ((player.x-camera.x)*gameZoom) + "px";

  asset.image.style.top =
    ((player.y-camera.y)*gameZoom) + "px";

  asset.image.style.transform =
    "translate(-50%, -" + asset.settings.ground*100 + "%)";
}

/* ================================================================
   [JS 07] PROFONDITÀ: OGGETTI DAVANTI O DIETRO

   Ridisegna sopra lo sprite solo i ritagli degli oggetti
   davanti ai quali Riccardo non è ancora passato.
   Non richiede nuove immagini trasparenti.
   ================================================================ */

function drawForeground() {
  prepareWorldContext(frontCtx);

  if (!CONFIG.depth || !activeAsset) return;

  const height = CONFIG.spriteHeight *
    activeAsset.settings.scale;

  const width = height *
    activeAsset.image.naturalWidth /
    activeAsset.image.naturalHeight;

  const actorBounds = {
    left: player.x-width/2,
    right: player.x+width/2,
    top: player.y-height*activeAsset.settings.ground,
    bottom: player.y+height*(1-activeAsset.settings.ground)
  };

  const visibleZones = world.depth.filter(zone => {
    if (player.y >= zone.baseY) return false;

    const xs = zone.polygon.map(p => p[0]);
    const ys = zone.polygon.map(p => p[1]);

    return (
      Math.max(...xs) >= actorBounds.left &&
      Math.min(...xs) <= actorBounds.right &&
      Math.max(...ys) >= actorBounds.top &&
      Math.min(...ys) <= actorBounds.bottom
    );
  });

  // Ogni zona riprende i pixel originali della mappa.
  for (const zone of visibleZones) {
    frontCtx.save();

    polygonPath(frontCtx, zone.polygon);
    frontCtx.clip();

    frontCtx.drawImage(
      mapImage, 0, 0, CONFIG.width, CONFIG.height
    );

    frontCtx.restore();
  }
}

function drawGame() {
  prepareWorldContext(ctx);

  ctx.drawImage(
    mapImage, 0, 0, CONFIG.width, CONFIG.height
  );

  drawActor();
  drawForeground();
}

/* ================================================================
   [JS 08] RESET E CICLO PRINCIPALE
   ================================================================ */

function returnToStation() {
  resetInput();

  player.x = CONFIG.start.x;
  player.y = CONFIG.start.y;
  player.direction = "down";

  updateCamera();

  if (ready) drawGame();
}

$("resetButton").onclick = returnToStation;

function updateStatus() {
  let message = "Map test · no battles";

  if (failedAssets.size) {
    message = "Missing image: " + [...failedAssets][0];
  } else if (
    player.x > 685 && player.x < 840 &&
    player.y > 1435 && player.y < 1500
  ) {
    message = "Job Center entrance · interior coming next";
  }

  if ($("status").textContent !== message) {
    $("status").textContent = message;
  }
}

function tick(now) {
  const dt = lastTime
    ? Math.min((now-lastTime)/1000, 0.04)
    : 0;

  lastTime = now;

  if (ready && !editorState.open && !document.hidden) {
    const direction = currentDirection();

    const oldX = player.x;
    const oldY = player.y;

    if (direction) {
      player.direction = direction;

      const vector = DIRECTIONS[direction];

      movePlayer(
        vector.x*CONFIG.speed*dt,
        vector.y*CONFIG.speed*dt
      );
    }

    player.moving = Math.hypot(
      player.x-oldX,
      player.y-oldY
    ) > 0.0001;

    updateCamera();
    drawGame();
    updateStatus();
  }

  requestAnimationFrame(tick);
}

/* ================================================================
   [EDITOR 01] STATO E STRUMENTI

   Collisioni: dove i piedi non possono passare.
   Profondità: contorno visivo dell'oggetto che copre Riccardo.
   ================================================================ */

const editorCanvas = $("editorCanvas");
const editorCtx = editorCanvas.getContext("2d");

const editorState = {
  open: false,
  layer: "collision",
  tool: "pan",
  selected: -1,
  draft: [],
  history: [],
  drag: null,
  scale: 1,
  x: 0,
  y: 0,
  settingBase: false
};

function editorItems() {
  return editorState.layer === "collision"
    ? world.collisions
    : world.depth;
}

function itemPolygon(item) {
  return editorState.layer === "collision"
    ? item
    : item.polygon;
}

function setItemPolygon(index, polygon) {
  if (editorState.layer === "collision") {
    world.collisions[index] = polygon;
  } else {
    world.depth[index].polygon = polygon;
  }
}

function pushHistory(snapshot = JSON.stringify(world)) {
  editorState.history.push(snapshot);

  if (editorState.history.length > 40) {
    editorState.history.shift();
  }
}

function editorNotice(text) {
  $("editorHint").textContent = text;
}

function editorHelp() {
  const s = editorState;

  let message;

  if (s.settingBase) {
    message = "Tocca la mappa all’altezza della base dell’oggetto.";
  } else if (s.tool === "pan") {
    message = "Trascina la mappa. Usa + e − per ingrandire.";
  } else if (s.tool === "draw") {
    message = "Tocca gli angoli in ordine, poi Chiudi forma.";
  } else {
    message = "Seleziona una forma e trascina i punti bianchi.";
  }

  if (s.layer === "depth") {
    message += " Blu: ritaglio visivo. Giallo: linea di base.";
  } else {
    message += " Rosso: ostacoli per i piedi.";
  }

  if (storageFailed) {
    message += " Salvataggio non disponibile: esporta i dati.";
  }

  editorNotice(message);
}

/* ================================================================
   [EDITOR 02] DISEGNO
   ================================================================ */

function paintEditor() {
  if (!editorState.open) return;

  const s = editorState;
  const c = editorCtx;

  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, editorCanvas.width, editorCanvas.height);

  c.fillStyle = "#10232d";
  c.fillRect(0, 0, editorCanvas.width, editorCanvas.height);

  c.translate(s.x, s.y);
  c.scale(s.scale, s.scale);
  c.imageSmoothingEnabled = false;

  c.drawImage(
    mapImage, 0, 0, CONFIG.width, CONFIG.height
  );

  editorItems().forEach((item, index) => {
    const polygon = itemPolygon(item);
    const selected = index === s.selected;

    polygonPath(c, polygon);

    c.fillStyle = selected
      ? "#ffde7966"
      : s.layer === "collision"
        ? "#ff34545c"
        : "#40bfff60";

    c.fill();

    c.lineWidth = 1.5/s.scale;
    c.strokeStyle = selected ? "#ffe08a" : "#ffffff88";
    c.stroke();

    if (!selected) return;

    for (const p of polygon) {
      c.fillStyle = "white";

      c.fillRect(
        p[0]-5/s.scale,
        p[1]-5/s.scale,
        10/s.scale,
        10/s.scale
      );
    }

    if (s.layer === "depth") {
      const xs = polygon.map(p => p[0]);

      c.beginPath();
      c.moveTo(Math.min(...xs)-15, item.baseY);
      c.lineTo(Math.max(...xs)+15, item.baseY);
      c.strokeStyle = "#ffdf59";
      c.lineWidth = 2/s.scale;
      c.stroke();

      c.fillStyle = "#ffdf59";
      c.font = (12/s.scale) + "px Arial";

      c.fillText(
        "BASE " + Math.round(item.baseY),
        Math.min(...xs),
        item.baseY-6/s.scale
      );
    }
  });

  if (s.draft.length) {
    c.beginPath();

    s.draft.forEach((p, i) => {
      if (!i) c.moveTo(p[0], p[1]);
      else c.lineTo(p[0], p[1]);
    });

    c.strokeStyle = "#7dffff";
    c.lineWidth = 2/s.scale;
    c.stroke();

    for (const p of s.draft) {
      c.fillStyle = "#7dffff";
      c.fillRect(
        p[0]-4/s.scale, p[1]-4/s.scale,
        8/s.scale, 8/s.scale
      );
    }
  }

  c.beginPath();
  c.arc(player.x, player.y, 7, 0, Math.PI*2);
  c.fillStyle = "white";
  c.fill();

  c.beginPath();
  c.arc(player.x, player.y, 5, 0, Math.PI*2);
  c.fillStyle = "#ed243b";
  c.fill();

  document.querySelectorAll("[data-layer]").forEach(b => {
    b.classList.toggle("active", b.dataset.layer === s.layer);
  });

  document.querySelectorAll("[data-tool]").forEach(b => {
    b.classList.toggle("active", b.dataset.tool === s.tool);
  });

  $("editorBase").disabled =
    s.layer !== "depth" || s.selected < 0;

  editorHelp();
}

/* ================================================================
   [EDITOR 03] VISTA COMPLETA E ZOOM
   ================================================================ */

function resizeEditor(fit = false) {
  if (!editorState.open) return;

  editorCanvas.width = Math.max(
    1, Math.round($("editorView").clientWidth)
  );

  editorCanvas.height = Math.max(
    1, Math.round($("editorView").clientHeight)
  );

  if (fit) {
    const s = editorState;

    s.scale = Math.min(
      editorCanvas.width/CONFIG.width,
      editorCanvas.height/CONFIG.height
    )*0.97;

    s.x = (editorCanvas.width-CONFIG.width*s.scale)/2;
    s.y = (editorCanvas.height-CONFIG.height*s.scale)/2;
  }

  paintEditor();
}

new ResizeObserver(() => {
  resizeEditor();
}).observe($("editorView"));

function zoomEditor(factor) {
  const s = editorState;
  const x = editorCanvas.width/2;
  const y = editorCanvas.height/2;

  const wx = (x-s.x)/s.scale;
  const wy = (y-s.y)/s.scale;

  s.scale = clamp(s.scale*factor, 0.12, 6);

  s.x = x-wx*s.scale;
  s.y = y-wy*s.scale;

  paintEditor();
}

/* ================================================================
   [EDITOR 04] APERTURA E CHIUSURA
   ================================================================ */

$("editorOpen").onclick = () => {
  if (!ready) return;

  resetInput();

  editorState.open = true;

  $("editor").hidden = false;
  game.inert = true;

  requestAnimationFrame(() => resizeEditor(true));
};

$("editorClose").onclick = () => {
  if (editorState.draft.length) {
    editorNotice(
      "Chiudi la forma in corso oppure togli i punti con Annulla."
    );
    return;
  }

  if (!canStand(player.x, player.y)) {
    editorNotice(
      "Il punto rosso è dentro un ostacolo: correggi la forma."
    );
    return;
  }

  saveWorld();

  editorState.open = false;
  editorState.settingBase = false;

  $("editor").hidden = true;
  game.inert = false;

  resetInput();
  lastTime = 0;

  $("editorOpen").focus();
};

/* ================================================================
   [EDITOR 05] CAMBIO LIVELLO E STRUMENTO
   ================================================================ */

document.querySelectorAll("[data-layer]").forEach(button => {
  button.onclick = () => {
    if (editorState.draft.length) {
      editorNotice("Termina o annulla prima la forma in corso.");
      return;
    }

    editorState.layer = button.dataset.layer;
    editorState.selected = -1;
    editorState.settingBase = false;

    paintEditor();
  };
});

document.querySelectorAll("[data-tool]").forEach(button => {
  button.onclick = () => {
    editorState.tool = button.dataset.tool;
    editorState.settingBase = false;
    paintEditor();
  };
});

$("editorPlus").onclick = () => zoomEditor(1.3);
$("editorMinus").onclick = () => zoomEditor(1/1.3);
$("editorFit").onclick = () => resizeEditor(true);

/* ================================================================
   [EDITOR 06] VALIDAZIONE DEI CONTORNI
   ================================================================ */

function shapeValid(polygon) {
  if (!validPolygon(polygon)) return false;

  const orient = (a,b,c) =>
    (b[0]-a[0])*(c[1]-a[1]) -
    (b[1]-a[1])*(c[0]-a[0]);

  let area = 0;

  for (let i = 0; i < polygon.length; i++) {
    const a = polygon[i];
    const b = polygon[(i+1)%polygon.length];

    area += a[0]*b[1] - b[0]*a[1];

    if (a[0] === b[0] && a[1] === b[1]) return false;

    for (let j = i+1; j < polygon.length; j++) {
      if (
        j === i+1 ||
        (i === 0 && j === polygon.length-1)
      ) continue;

      const c = polygon[j];
      const d = polygon[(j+1)%polygon.length];

      const overlap =
        Math.max(Math.min(a[0],b[0]),Math.min(c[0],d[0])) <=
        Math.min(Math.max(a[0],b[0]),Math.max(c[0],d[0])) &&
        Math.max(Math.min(a[1],b[1]),Math.min(c[1],d[1])) <=
        Math.min(Math.max(a[1],b[1]),Math.max(c[1],d[1]));

      if (
        overlap &&
        orient(a,b,c)*orient(a,b,d) <= 0 &&
        orient(c,d,a)*orient(c,d,b) <= 0
      ) return false;
    }
  }

  return Math.abs(area)/2 > 3;
}

/* ================================================================
   [EDITOR 07] NUOVE FORME, BASE, ANNULLA ED ELIMINA
   ================================================================ */

$("editorFinish").onclick = () => {
  const s = editorState;

  if (!shapeValid(s.draft)) {
    editorNotice(
      "Servono almeno tre punti. Il contorno non deve incrociarsi."
    );
    return;
  }

  pushHistory();

  if (s.layer === "collision") {
    world.collisions.push(clone(s.draft));
  } else {
    world.depth.push({
      name: "Oggetto " + (world.depth.length+1),
      baseY: Math.max(...s.draft.map(p => p[1])),
      polygon: clone(s.draft)
    });
  }

  s.selected = editorItems().length-1;
  s.draft = [];
  s.tool = "edit";

  saveWorld();
  paintEditor();
};

$("editorBase").onclick = () => {
  if (
    editorState.layer !== "depth" ||
    editorState.selected < 0
  ) return;

  editorState.settingBase = true;
  paintEditor();
};

$("editorUndo").onclick = () => {
  const s = editorState;

  s.settingBase = false;

  if (s.draft.length) {
    s.draft.pop();
  } else if (s.history.length) {
    world = JSON.parse(s.history.pop());
    s.selected = -1;
    saveWorld();
  }

  paintEditor();
};

$("editorDelete").onclick = () => {
  if (editorState.selected < 0) return;

  pushHistory();

  editorItems().splice(editorState.selected, 1);

  editorState.selected = -1;
  editorState.settingBase = false;

  saveWorld();
  paintEditor();
};

/* ================================================================
   [EDITOR 08] COORDINATE DEL TOCCO
   ================================================================ */

function editorPoint(event) {
  const r = editorCanvas.getBoundingClientRect();

  return {
    x: (event.clientX-r.left)*editorCanvas.width/r.width,
    y: (event.clientY-r.top)*editorCanvas.height/r.height
  };
}

function editorWorldPoint(point) {
  const s = editorState;

  return [
    Math.round(clamp((point.x-s.x)/s.scale, 0, CONFIG.width)),
    Math.round(clamp((point.y-s.y)/s.scale, 0, CONFIG.height))
  ];
}

/* ================================================================
   [EDITOR 09] TOCCO E SELEZIONE
   ================================================================ */

editorCanvas.onpointerdown = event => {
  const s = editorState;

  if (s.drag) return;

  event.preventDefault();
  editorCanvas.setPointerCapture(event.pointerId);

  const point = editorPoint(event);
  const wp = editorWorldPoint(point);

  if (s.settingBase && s.selected >= 0) {
    pushHistory();

    world.depth[s.selected].baseY = wp[1];

    s.settingBase = false;

    saveWorld();
    paintEditor();
    return;
  }

  if (s.tool === "draw") {
    const previous = s.draft[s.draft.length-1];

    if (
      !previous ||
      Math.hypot(wp[0]-previous[0], wp[1]-previous[1]) > 2
    ) s.draft.push(wp);

    paintEditor();
    return;
  }

  if (s.tool === "pan") {
    s.drag = {
      id: event.pointerId,
      kind: "pan",
      point,
      x: s.x,
      y: s.y
    };
    return;
  }

  if (s.selected >= 0) {
    const polygon = itemPolygon(editorItems()[s.selected]);

    const vertex = polygon.findIndex(p =>
      Math.hypot(p[0]-wp[0], p[1]-wp[1]) < 16/s.scale
    );

    if (vertex >= 0) {
      s.drag = {
        id: event.pointerId,
        kind: "vertex",
        vertex,
        before: JSON.stringify(world)
      };
      return;
    }
  }

  s.selected = -1;

  const items = editorItems();

  for (let i = items.length-1; i >= 0; i--) {
    if (pointInPolygon(wp[0], wp[1], itemPolygon(items[i]))) {
      s.selected = i;
      break;
    }
  }

  if (s.selected >= 0) {
    s.drag = {
      id: event.pointerId,
      kind: "shape",
      point: wp,
      original: clone(itemPolygon(items[s.selected])),
      originalBase: s.layer === "depth"
        ? items[s.selected].baseY
        : null,
      before: JSON.stringify(world)
    };
  }

  paintEditor();
};

/* ================================================================
   [EDITOR 10] TRASCINAMENTO
   ================================================================ */

editorCanvas.onpointermove = event => {
  const s = editorState;
  const drag = s.drag;

  if (!drag || drag.id !== event.pointerId) return;

  const point = editorPoint(event);
  const wp = editorWorldPoint(point);

  if (drag.kind === "pan") {
    s.x = drag.x + point.x-drag.point.x;
    s.y = drag.y + point.y-drag.point.y;
  } else if (drag.kind === "vertex") {
    const polygon = itemPolygon(editorItems()[s.selected]);
    polygon[drag.vertex] = wp;
  } else {
    const xs = drag.original.map(p => p[0]);
    const ys = drag.original.map(p => p[1]);

    const dx = clamp(
      wp[0]-drag.point[0],
      -Math.min(...xs),
      CONFIG.width-Math.max(...xs)
    );

    const dy = clamp(
      wp[1]-drag.point[1],
      -Math.min(...ys),
      CONFIG.height-Math.max(...ys)
    );

    setItemPolygon(
      s.selected,
      drag.original.map(p => [p[0]+dx, p[1]+dy])
    );

    if (s.layer === "depth") {
      world.depth[s.selected].baseY = clamp(
        drag.originalBase+dy, 0, CONFIG.height
      );
    }
  }

  paintEditor();
};

function finishEditorDrag(event) {
  const s = editorState;
  const drag = s.drag;

  if (!drag || drag.id !== event.pointerId) return;

  let invalid = false;

  if (drag.before) {
    invalid = !shapeValid(itemPolygon(editorItems()[s.selected]));

    if (event.type === "pointercancel" || invalid) {
      world = JSON.parse(drag.before);
    } else if (drag.before !== JSON.stringify(world)) {
      pushHistory(drag.before);
      saveWorld();
    }
  }

  s.drag = null;

  paintEditor();

  if (invalid) {
    editorNotice("Contorno non valido: modifica annullata.");
  }
}

editorCanvas.onpointerup = finishEditorDrag;
editorCanvas.onpointercancel = finishEditorDrag;
editorCanvas.onlostpointercapture = finishEditorDrag;

/* ================================================================
   [EDITOR 11] ESPORTAZIONE DI COLLISIONI E PROFONDITÀ

   Esporta entrambi i livelli insieme.
   Mandami il testo quando hai finito le correzioni.
   ================================================================ */

$("editorExport").onclick = () => {
  if (editorState.draft.length) {
    editorNotice("Termina prima la forma in corso.");
    return;
  }

  saveWorld();

  $("exportData").value = JSON.stringify({
    map: CONFIG.map,
    version: DATA_VERSION,
    collisions: world.collisions,
    depth: world.depth
  }, null, 2);

  $("exportPanel").hidden = false;
  $("exportCopy").textContent = "Copia";
};

$("exportCopy").onclick = async function() {
  try {
    await navigator.clipboard.writeText($("exportData").value);
    this.textContent = "Copiato!";
  } catch (_) {
    $("exportData").focus();
    $("exportData").select();
    this.textContent = "Seleziona e copia il testo";
  }
};

$("exportClose").onclick = () => {
  $("exportPanel").hidden = true;
};

/* ================================================================
   [JS 09] CARICAMENTO MAPPA E AVVIO
   ================================================================ */

mapImage.onload = () => {
  ready = true;
  $("loading").hidden = true;

  resize();
  returnToStation();
};

mapImage.onerror = () => {
  ready = false;
  resetInput();

  $("loading").hidden = false;
  $("loadingTitle").textContent = "Unable to load the map";
  $("loadingText").textContent =
    "Check the filename and its location beside index.html.";

  $("retryLoad").hidden = false;
};

$("retryLoad").onclick = function() {
  $("loadingTitle").textContent = "Loading Seoul…";
  $("loadingText").textContent = "Please wait.";
  this.hidden = true;

  mapImage.src = CONFIG.map + "?retry=" + Date.now();
};

resize();

mapImage.src = CONFIG.map;

requestAnimationFrame(tick);
</script>
</body>
</html>
