/* [JS 02] CARICAMENTO E ALLINEAMENTO AUTOMATICO DEGLI SPRITE
   Legge il corpo visibile: PNG e GIF hanno margini diversi.
   Le GIF restano elementi IMG per mantenere l'animazione.
*/

function loadImage(file){
 return new Promise(resolve=>{
  const image=new Image();
  image.onload=()=>{missing.delete(file);resolve(image);};
  image.onerror=()=>{missing.add(file);resolve(null);};
  image.src=file;
 });
}

function measureSprite(image){
 const w=image.naturalWidth,h=image.naturalHeight;
 let box={left:0,top:0,right:w,bottom:h};

 try{
  const c=document.createElement("canvas");
  c.width=w;c.height=h;
  const g=c.getContext("2d",{willReadFrequently:true});
  g.drawImage(image,0,0);
  const data=g.getImageData(0,0,w,h).data;
  let left=w,top=h,right=-1,bottom=-1;

  for(let y=0;y<h;y++){
   for(let x=0;x<w;x++){
    if(data[(y*w+x)*4+3]>=220){
     left=Math.min(left,x);right=Math.max(right,x);
     top=Math.min(top,y);bottom=Math.max(bottom,y);
    }
   }
  }
  if(right>=left)box={left,top,right:right+1,bottom:bottom+1};
 }catch(_){}

 return box;
}

async function loadActors(){
 await Promise.all(Object.entries(SPRITES).flatMap(([mode,dirs])=>
  Object.entries(dirs).map(async([dir,file])=>{
   const image=await loadImage(file);
   if(!image)return;
   const box=measureSprite(image);
   image.alt="";image.draggable=false;
   assets[mode][dir]={image,box};
   actor.appendChild(image);
  })
 ));
}

async function loadBuses(){

   c.width=image.naturalWidth;c.height=image.naturalHeight;
   c.getContext("2d").drawImage(image,0,0);
   still=c.toDataURL();
  }catch(_){}

  busResources.push({file,still});
 }));
}

 const s=CONFIG.spriteHeight/(box.bottom-box.top);
 const top=-box.bottom*s;
 const cut=intro?
  Math.max(0,CONFIG.entrance.clipTop-player.y-top):0;

 Object.assign(image.style,{
  width:image.naturalWidth*s+"px",
  height:image.naturalHeight*s+"px",
  left:-(box.left+box.right)/2*s+"px",
  top:top+"px",
  clipPath:`inset(${Math.max(box.top*s,cut)}px ${(image.naturalWidth-box.right)*s}px ${(image.naturalHeight-box.bottom)*s}px ${box.left*s}px)`
 });

 Object.assign(actor.style,{
  left:player.x+"px",
  top:player.y+"px",
  zIndex:String(Math.round(player.y*100)+1)
 });
}

  const xs=z.polygon.map(p=>p[0]),ys=z.polygon.map(p=>p[1]);
  const x=Math.floor(Math.min(...xs)),y=Math.floor(Math.min(...ys));
  const c=document.createElement("canvas");

  c.width=Math.ceil(Math.max(...xs))-x+1;
  c.height=Math.ceil(Math.max(...ys))-y+1;
  c.className="item";

  Object.assign(c.style,{
   left:x+"px",top:y+"px",
   zIndex:String(Math.round(z.baseY*100))
  });

  const g=c.getContext("2d");
  g.translate(-x,-y);
  path(g,z.polygon);g.clip();
  g.drawImage(mapImage,0,0,CONFIG.width,CONFIG.height);
  scene.appendChild(c);depthNodes.push(c);
 }
}

/* [JS 04] COLLISIONI DEL CERCHIO AI PIEDI */

function inside(x,y,p){
 let hit=false;
 for(let i=0,j=p.length-1;i<p.length;j=i++){
  const a=p[i],b=p[j];
  if((a[1]>y)!==(b[1]>y)&&
   x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])hit=!hit;
 }
 return hit;
}

function segmentDistance(x,y,a,b){
 const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;
 const t=l?clamp(((x-a[0])*dx+(y-a[1])*dy)/l,0,1):0;
 return(x-a[0]-t*dx)**2+(y-a[1]-t*dy)**2;
}

function canStand(x,y){
 const r=CONFIG.radius;
 if(x<r||y<r||x>CONFIG.width-r||y>CONFIG.height-r)return false;

 return!CONFIG.collisions||!world.collisions.some(p=>
  inside(x,y,p)||p.some((a,i)=>
   segmentDistance(x,y,a,p[(i+1)%p.length])<=r*r
  )
 );
}

function movePlayer(dx,dy){
 const n=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/2));
 for(let i=0;i<n;i++){
  if(canStand(player.x+dx/n,player.y))player.x+=dx/n;
  if(canStand(player.x,player.y+dy/n))player.y+=dy/n;
 }
}

/* [JS 05] COMANDI: SOLO QUATTRO DIREZIONI */

const DIR={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const KEY={
 arrowup:"up",w:"up",arrowdown:"down",s:"down",
 arrowleft:"left",a:"left",arrowright:"right",d:"right"
};

function direction(){return[...held.values()].pop()||null;}
function buttons(){
 all("#dpad button").forEach(b=>
  b.classList.toggle("pressed",b.dataset.dir===direction())
 );
}
function resetInput(){held.clear();player.moving=false;buttons();}
function press(token,dir){
 held.delete(token);held.set(token,dir);buttons();
}

window.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 if(!KEY[k]||!$("exportPanel").hidden)return;
 e.preventDefault();
 if(ready&&!E.open&&!intro&&!e.repeat)press("k:"+k,KEY[k]);
});

window.addEventListener("keyup",e=>{
 held.delete("k:"+e.key.toLowerCase());buttons();
});

all("#dpad button").forEach(b=>{
 b.onpointerdown=e=>{
  if(!ready||E.open||intro)return;
  e.preventDefault();b.setPointerCapture(e.pointerId);
  press("p:"+e.pointerId,b.dataset.dir);
 };
 for(const type of["pointerup","pointercancel","lostpointercapture"]){
  b.addEventListener(type,e=>{
   held.delete("p:"+e.pointerId);buttons();
  });
 }
});

window.addEventListener("blur",resetInput);
document.addEventListener("visibilitychange",()=>{
 resetInput();lastTime=0;
});

/* [JS 06] CAMERA E ZOOM */

function updateCamera(){
 const w=viewWidth/zoom,h=viewHeight/zoom;
 camera.x=CONFIG.width>w?
  clamp(player.x-w/2,0,CONFIG.width-w):(CONFIG.width-w)/2;
 camera.y=CONFIG.height>h?
  clamp(player.y-h/2,0,CONFIG.height-h):(CONFIG.height-h)/2;
}

function resize(){
 const r=game.getBoundingClientRect();
 viewWidth=Math.max(1,r.width);viewHeight=Math.max(1,r.height);
 density=Math.min(window.devicePixelRatio||1,2);
 canvas.width=Math.round(viewWidth*density);
 canvas.height=Math.round(viewHeight*density);
 updateCamera();if(ready)draw();
}

function draw(){
 ctx.setTransform(density,0,0,density,0,0);
 ctx.clearRect(0,0,viewWidth,viewHeight);
 ctx.imageSmoothingEnabled=false;
 ctx.scale(zoom,zoom);ctx.translate(-camera.x,-camera.y);
 ctx.drawImage(mapImage,0,0,CONFIG.width,CONFIG.height);
 scene.style.transform=
  `translate(${-camera.x*zoom}px,${-camera.y*zoom}px) scale(${zoom})`;
 drawActor();
}

new ResizeObserver(resize).observe(game);

$("zoomIn").onclick=()=>{
 zoom=clamp(zoom+.2,CONFIG.minZoom,CONFIG.maxZoom);
};
$("zoomOut").onclick=()=>{
 zoom=clamp(zoom-.2,CONFIG.minZoom,CONFIG.maxZoom);
};

/* ================================================================
   [TRAFFIC 01] COLORI E INTERVALLI CASUALI
   Sono possibili due bus consecutivi dello stesso colore.
   ================================================================ */

function spawnBus(){
 if(!busResources.length||buses.length>=TRAFFIC.maxBuses)return false;
 const x=CONFIG.width+TRAFFIC.width/2+15;

 if(buses.some(b=>x-b.x<TRAFFIC.width+TRAFFIC.gap+30))return false;

 const r=busResources[Math.floor(Math.random()*busResources.length)];
 const node=document.createElement("div");
 const moving=new Image(),still=new Image();

 node.className="bus item";
 Object.assign(node.style,{
  width:TRAFFIC.width+"px",
  top:TRAFFIC.groundY+"px",
  zIndex:String(Math.round(TRAFFIC.groundY*100)+1)
 });

 moving.src=r.file;moving.alt="";
 still.src=r.still||r.file;still.alt="";still.hidden=true;
 node.append(moving,still);scene.appendChild(node);

 buses.push({
  x,v:0,speed:random(TRAFFIC.minSpeed,TRAFFIC.maxSpeed),
  node,moving,still,stopped:false
 });
 return true;
}

/* [TRAFFIC 02] DISTANZE E PRECEDENZA A RICCARDO SULLE STRISCE */

function updateTraffic(dt){
 nextBus-=dt;
 if(nextBus<=0){
  nextBus=spawnBus()?random(TRAFFIC.minDelay,TRAFFIC.maxDelay):.5;
 }
 buses.sort((a,b)=>a.x-b.x);

 const c=TRAFFIC.crossing;
 const yielding=player.x>c.left-10&&player.x<c.right+10&&
  player.y>c.top&&player.y<c.bottom;

 for(let i=0;i<buses.length;i++){
  const b=buses[i],front=b.x-TRAFFIC.width/2;
  let distance=Infinity;

  if(i>0){
   distance=Math.max(
    0,b.x-buses[i-1].x-TRAFFIC.width-TRAFFIC.gap
   );
  }
  if(yielding&&front>=c.stopX-.01){
   distance=Math.min(distance,Math.max(0,front-c.stopX));
  }

  const target=Math.min(b.speed,Math.sqrt(2*TRAFFIC.braking*distance));
  b.v=target>b.v?
   Math.min(target,b.v+TRAFFIC.acceleration*dt):
   Math.max(target,b.v-TRAFFIC.braking*dt);

  const travel=Math.min(b.v*dt,distance);
  b.x-=travel;
  if(distance-travel<.01)b.v=0;

  const stopped=b.v<1;
  if(stopped!==b.stopped){
   b.stopped=stopped;
   b.moving.hidden=stopped;b.still.hidden=!stopped;
  }
  b.node.style.left=b.x+"px";
 }

 buses=buses.filter(b=>{
  if(b.x<-TRAFFIC.width){b.node.remove();return false;}
  return true;
 });
}

/* [INTRO 01] USCITA DALLA STAZIONE E RESET */

function returnToStation(){
 resetInput();intro=true;
 player.x=CONFIG.entrance.x;player.y=CONFIG.entrance.y;
 player.direction="down";
 $("editorOpen").disabled=true;
 updateCamera();if(ready)draw();
}

function updatePlayer(dt){
 const x=player.x,y=player.y;

 if(intro){
  player.y=Math.min(CONFIG.start.y,player.y+CONFIG.entrance.speed*dt);
  if(player.y>=CONFIG.start.y){
   intro=false;$("editorOpen").disabled=false;resetInput();
  }
 }else{
  const d=direction();
  if(d){
   player.direction=d;
   movePlayer(DIR[d][0]*CONFIG.speed*dt,DIR[d][1]*CONFIG.speed*dt);
  }
 }
 player.moving=Math.hypot(player.x-x,player.y-y)>.0001;
}

$("resetButton").onclick=returnToStation;

/* [JS 07] CICLO PRINCIPALE E MESSAGGI */

function updateStatus(){
 let text=intro?"Arriving in Seoul…":"Map test · no battles";
 if(missing.size)text="Missing image: "+[...missing][0];
 else if(!intro&&player.x>685&&player.x<840&&player.y>1435&&player.y<1500){
  text="Job Center entrance · interior coming next";
 }
 if($("status").textContent!==text)$("status").textContent=text;
}

function tick(now){
 const dt=lastTime?Math.min((now-lastTime)/1000,.04):0;
 lastTime=now;

 if(ready&&!E.open&&!document.hidden){
  updatePlayer(dt);updateTraffic(dt);
  updateCamera();draw();updateStatus();
 }
 requestAnimationFrame(tick);
}

/* ================================================================
   [EDITOR 01] STATO, STORICO E DISEGNO
   ================================================================ */

const ec=$("editorCanvas"),eg=ec.getContext("2d");
const items=()=>E.layer==="collision"?world.collisions:world.depth;
const polygon=o=>E.layer==="collision"?o:o.polygon;

function setPolygon(i,p){
 if(E.layer==="collision")world.collisions[i]=p;
 else world.depth[i].polygon=p;
}

function remember(s=JSON.stringify(world)){
 E.history.push(s);
 if(E.history.length>40)E.history.shift();
}

function notice(t){$("editorHint").textContent=t;}

function paintEditor(){
 if(!E.open)return;
 eg.setTransform(1,0,0,1,0,0);
 eg.clearRect(0,0,ec.width,ec.height);
 eg.fillStyle="#10232d";eg.fillRect(0,0,ec.width,ec.height);
 eg.translate(E.x,E.y);eg.scale(E.scale,E.scale);
 eg.imageSmoothingEnabled=false;
 eg.drawImage(mapImage,0,0,CONFIG.width,CONFIG.height);

 items().forEach((o,i)=>{
  const p=polygon(o),selected=i===E.selected;
  path(eg,p);
  eg.fillStyle=selected?"#ffde7966":
   E.layer==="collision"?"#ff34545c":"#40bfff60";
  eg.fill();eg.strokeStyle=selected?"#ffe08a":"#ffffff88";
  eg.lineWidth=1.5/E.scale;eg.stroke();
  if(!selected)return;

  for(const v of p){
   eg.fillStyle="white";
   eg.fillRect(v[0]-5/E.scale,v[1]-5/E.scale,10/E.scale,10/E.scale);
  }

  if(E.layer==="depth"){
   const xs=p.map(v=>v[0]);
   eg.beginPath();
   eg.moveTo(Math.min(...xs)-15,o.baseY);
   eg.lineTo(Math.max(...xs)+15,o.baseY);
   eg.strokeStyle="#ffdf59";eg.lineWidth=2/E.scale;eg.stroke();
   eg.fillStyle="#ffdf59";eg.font=12/E.scale+"px Arial";
   eg.fillText(
    (o.name||"Oggetto")+" · "+o.baseY,
    Math.min(...xs),o.baseY-7/E.scale
   );
  }
 });

 if(E.draft.length){
  eg.beginPath();
  E.draft.forEach((v,i)=>i?eg.lineTo(...v):eg.moveTo(...v));
  eg.strokeStyle="#7dffff";eg.lineWidth=2/E.scale;eg.stroke();
  for(const v of E.draft){
   eg.fillStyle="#7dffff";
   eg.fillRect(v[0]-4/E.scale,v[1]-4/E.scale,8/E.scale,8/E.scale);
  }
 }

 eg.beginPath();eg.arc(player.x,player.y,6,0,Math.PI*2);
 eg.fillStyle="#ff243b";eg.fill();

 all("[data-layer]").forEach(b=>
  b.classList.toggle("active",b.dataset.layer===E.layer)
 );
 all("[data-tool]").forEach(b=>
  b.classList.toggle("active",b.dataset.tool===E.tool)
 );
 $("editorBase").disabled=E.layer!=="depth"||E.selected<0;

 notice(
  (E.base?"Tocca l'altezza della base dell'oggetto.":
   E.tool==="pan"?"Trascina la mappa. Usa + e − per ingrandire.":
   E.tool==="draw"?"Tocca gli angoli in ordine, poi Chiudi forma.":
   "Seleziona una forma e trascina i punti bianchi.")+
  (E.layer==="depth"?" Blu: contorno visivo. Giallo: base.":
   " Rosso: ostacoli per i piedi.")+
  (storageFailed?" Salvataggio non disponibile: esporta i dati.":"")
 );
}

/* [EDITOR 02] APERTURA, ZOOM E STRUMENTI */

function resizeEditor(fit=false){
 if(!E.open)return;
 ec.width=Math.max(1,$("editorView").clientWidth);
 ec.height=Math.max(1,$("editorView").clientHeight);

 if(fit){
  E.scale=Math.min(ec.width/CONFIG.width,ec.height/CONFIG.height)*.97;
  E.x=(ec.width-CONFIG.width*E.scale)/2;
  E.y=(ec.height-CONFIG.height*E.scale)/2;
 }
 paintEditor();
}

new ResizeObserver(()=>resizeEditor()).observe($("editorView"));

function editorZoom(f){
 const x=ec.width/2,y=ec.height/2;
 const wx=(x-E.x)/E.scale,wy=(y-E.y)/E.scale;
 E.scale=clamp(E.scale*f,.12,6);
 E.x=x-wx*E.scale;E.y=y-wy*E.scale;
 paintEditor();
}

$("editorOpen").onclick=()=>{
 if(!ready||intro)return;
 resetInput();E.open=true;
 $("editor").hidden=false;game.inert=true;
 requestAnimationFrame(()=>resizeEditor(true));
};

$("editorClose").onclick=()=>{
 if(E.draft.length){
  notice("Termina la forma o usa Annulla.");return;
 }
 if(!canStand(player.x,player.y)){
  notice("Riccardo è dentro un ostacolo: correggi la forma.");return;
 }
 saveWorld();buildDepth();E.open=false;E.base=false;
 $("editor").hidden=true;game.inert=false;
 resetInput();lastTime=0;$("editorOpen").focus();
};

all("[data-layer]").forEach(b=>b.onclick=()=>{
 if(E.draft.length){notice("Termina prima la forma.");return;}
 E.layer=b.dataset.layer;E.selected=-1;E.base=false;
 paintEditor();
});

all("[data-tool]").forEach(b=>b.onclick=()=>{
 E.tool=b.dataset.tool;E.base=false;paintEditor();
});

$("editorPlus").onclick=()=>editorZoom(1.3);
$("editorMinus").onclick=()=>editorZoom(1/1.3);
$("editorFit").onclick=()=>resizeEditor(true);
$("editorBase").onclick=()=>{
 if(E.layer==="depth"&&E.selected>=0){E.base=true;paintEditor();}
};

/* [EDITOR 03] VALIDAZIONE, CREAZIONE, ANNULLA ED ELIMINA */

function shapeValid(p){
 if(!validPolygon(p))return false;
 const orient=(a,b,c)=>
  (b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);
 let area=0;

 for(let i=0;i<p.length;i++){
  const a=p[i],b=p[(i+1)%p.length];
  area+=a[0]*b[1]-b[0]*a[1];
  if(a[0]===b[0]&&a[1]===b[1])return false;

  for(let j=i+1;j<p.length;j++){
   if(j===i+1||(i===0&&j===p.length-1))continue;
   const c=p[j],d=p[(j+1)%p.length];
   const overlap=
    Math.max(Math.min(a[0],b[0]),Math.min(c[0],d[0]))<=
    Math.min(Math.max(a[0],b[0]),Math.max(c[0],d[0]))&&
    Math.max(Math.min(a[1],b[1]),Math.min(c[1],d[1]))<=
    Math.min(Math.max(a[1],b[1]),Math.max(c[1],d[1]));

   if(overlap&&orient(a,b,c)*orient(a,b,d)<=0&&
    orient(c,d,a)*orient(c,d,b)<=0)return false;
  }
 }
 return Math.abs(area)/2>3;
}

$("editorFinish").onclick=()=>{
 if(!shapeValid(E.draft)){
  notice("Servono almeno tre punti e un contorno non incrociato.");return;
 }
 remember();

 items().push(E.layer==="collision"?clone(E.draft):
  zone(
   "Oggetto "+(world.depth.length+1),
   Math.max(...E.draft.map(p=>p[1])),
   clone(E.draft)
  )
 );

 E.selected=items().length-1;E.draft=[];E.tool="edit";
 saveWorld();paintEditor();
};

$("editorUndo").onclick=()=>{
 E.base=false;
 if(E.draft.length)E.draft.pop();
 else if(E.history.length){
  world=JSON.parse(E.history.pop());E.selected=-1;saveWorld();
 }
 paintEditor();
};

$("editorDelete").onclick=()=>{
 if(E.selected<0)return;
 remember();items().splice(E.selected,1);
 E.selected=-1;E.base=false;saveWorld();paintEditor();
};

/* [EDITOR 04] TOCCO E TRASCINAMENTO */

function editorPoint(e){
 const r=ec.getBoundingClientRect();
 return{
  x:(e.clientX-r.left)*ec.width/r.width,
  y:(e.clientY-r.top)*ec.height/r.height
 };
}

function worldPoint(p){
 return[
  Math.round(clamp((p.x-E.x)/E.scale,0,CONFIG.width)),
  Math.round(clamp((p.y-E.y)/E.scale,0,CONFIG.height))
 ];
}

ec.onpointerdown=e=>{
 if(E.drag)return;
 e.preventDefault();ec.setPointerCapture(e.pointerId);
 const p=editorPoint(e),w=worldPoint(p);

 if(E.base&&E.selected>=0){
  remember();world.depth[E.selected].baseY=w[1];
  E.base=false;saveWorld();paintEditor();return;
 }

 if(E.tool==="draw"){
  const prev=E.draft[E.draft.length-1];
  if(!prev||Math.hypot(w[0]-prev[0],w[1]-prev[1])>2)E.draft.push(w);
  paintEditor();return;
 }

 if(E.tool==="pan"){
  E.drag={id:e.pointerId,kind:"pan",point:p,x:E.x,y:E.y};return;
 }

 if(E.selected>=0){
  const vertex=polygon(items()[E.selected]).findIndex(v=>
   Math.hypot(v[0]-w[0],v[1]-w[1])<16/E.scale
  );
  if(vertex>=0){
   E.drag={
    id:e.pointerId,kind:"vertex",vertex,
    before:JSON.stringify(world)
   };
   return;
  }
 }

 E.selected=-1;
 for(let i=items().length-1;i>=0;i--){
  if(inside(w[0],w[1],polygon(items()[i]))){E.selected=i;break;}
 }

 if(E.selected>=0){
  E.drag={
   id:e.pointerId,kind:"shape",point:w,
   original:clone(polygon(items()[E.selected])),
   baseY:E.layer==="depth"?items()[E.selected].baseY:0,
   before:JSON.stringify(world)
  };
 }
 paintEditor();
};

ec.onpointermove=e=>{
 const d=E.drag;
 if(!d||d.id!==e.pointerId)return;
 const p=editorPoint(e),w=worldPoint(p);

 if(d.kind==="pan"){
  E.x=d.x+p.x-d.point.x;E.y=d.y+p.y-d.point.y;
 }else if(d.kind==="vertex"){
  polygon(items()[E.selected])[d.vertex]=w;
 }else{
  const xs=d.original.map(p=>p[0]),ys=d.original.map(p=>p[1]);
  const dx=clamp(
   w[0]-d.point[0],-Math.min(...xs),CONFIG.width-Math.max(...xs)
  );
  const dy=clamp(
   w[1]-d.point[1],-Math.min(...ys),CONFIG.height-Math.max(...ys)
  );
  setPolygon(E.selected,d.original.map(p=>[p[0]+dx,p[1]+dy]));

  if(E.layer==="depth"){
   items()[E.selected].baseY=clamp(d.baseY+dy,0,CONFIG.height);
  }
 }
 paintEditor();
};

function endDrag(e){
 const d=E.drag;
 if(!d||d.id!==e.pointerId)return;
 let invalid=false;

 if(d.before){
  invalid=!shapeValid(polygon(items()[E.selected]));
  if(e.type==="pointercancel"||invalid)world=JSON.parse(d.before);
  else if(d.before!==JSON.stringify(world)){
   remember(d.before);saveWorld();
  }
 }
 E.drag=null;paintEditor();
 if(invalid)notice("Contorno non valido: modifica annullata.");
}

ec.onpointerup=endDrag;
ec.onpointercancel=endDrag;
ec.onlostpointercapture=endDrag;

/* [EDITOR 05] ESPORTAZIONE E COPIA */

$("editorExport").onclick=()=>{
 if(E.draft.length){notice("Termina prima la forma.");return;}
 saveWorld();
 $("exportData").value=JSON.stringify({
  map:CONFIG.map,version:DATA_VERSION,...world
 },null,2);
 $("exportPanel").hidden=false;
 $("exportCopy").textContent="Copia";
};

$("exportCopy").onclick=async function(){
 try{
  await navigator.clipboard.writeText($("exportData").value);
  this.textContent="Copiato!";
 }catch(_){
  $("exportData").focus();$("exportData").select();
  this.textContent="Seleziona e copia il testo";
 }
};

$("exportClose").onclick=()=>{$("exportPanel").hidden=true;};

/* ================================================================
   [BOOT 01] CARICAMENTO E AVVIO
   ================================================================ */

const actorsReady=loadActors();
loadBuses();

Object.assign($("trainImage").style,{
 left:TRAIN.x+"px",top:TRAIN.y+"px",
 width:TRAIN.width+"px",height:TRAIN.height+"px"
});

$("trainImage").onerror=()=>{
 missing.add(TRAIN.file);$("trainImage").hidden=true;
};
$("trainImage").src=TRAIN.file;

mapImage.onload=async()=>{
 await actorsReady;
 ready=true;$("loading").hidden=true;
 buildDepth();resize();returnToStation();
};

mapImage.onerror=()=>{
 ready=false;resetInput();
 $("loading").hidden=false;
 $("loadingTitle").textContent="Unable to load the map";
 $("loadingText").textContent="Check the filename beside index.html.";
 $("retryLoad").hidden=false;
};

$("retryLoad").onclick=function(){
 $("loadingTitle").textContent="Loading Seoul…";
 $("loadingText").textContent="Please wait.";
 this.hidden=true;
 mapImage.src=CONFIG.map+"?retry="+Date.now();
};

resize();
mapImage.src=CONFIG.map;
requestAnimationFrame(tick);
