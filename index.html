  return Array.isArray(p) && p.length>=3 && p.every(v =>
    Array.isArray(v) && v.length===2 && v.every(Number.isFinite)
  );
}
function validWorld(w) {
  return w && Array.isArray(w.collisions) &&
    w.collisions.every(validPolygon) && Array.isArray(w.depth) &&
    w.depth.every(z => z && Number.isFinite(z.baseY) && validPolygon(z.polygon));
}

/*
  Analizza il bordo trasparente e ritaglia visivamente l'immagine.
  Il file originale resta intero: le GIF continuano ad animarsi.
*/
function loadAsset(file) {
  if(cache.has(file)) return cache.get(file);

  const promise=new Promise(resolve => {
    const image=new Image();
    image.onload=() => {
      let bounds={x:0,y:0,w:image.naturalWidth,h:image.naturalHeight};

      try {
        const c=document.createElement("canvas");
        c.width=image.naturalWidth; c.height=image.naturalHeight;
        const ctx=c.getContext("2d",{willReadFrequently:true});
        ctx.drawImage(image,0,0);
        const data=ctx.getImageData(0,0,c.width,c.height).data;
        let left=c.width,top=c.height,right=-1,bottom=-1;

        for(let y=0;y<c.height;y++) {
          for(let x=0;x<c.width;x++) {
            if(data[(y*c.width+x)*4+3]<100) continue;
            left=Math.min(left,x); right=Math.max(right,x);
            top=Math.min(top,y); bottom=Math.max(bottom,y);
          }
        }
        if(right>=left && bottom>=top) {
          bounds={x:left,y:top,w:right-left+1,h:bottom-top+1};
        }
      } catch(_) {}

      missing.delete(file);
      resolve({file,image,bounds});
    };
    image.onerror=() => { missing.add(file); resolve(null); };
    image.src=file;
  });

  cache.set(file,promise);
  return promise;
}

function createActor(height=54,width=null) {
  const node=document.createElement("div");
  node.className="sprite";

  scene.appendChild(node);

  const actor={
    node,height,width,assets:new Map(),active:null,
    visibleWidth:width||30,visibleHeight:height
  };
  actors.push(actor);
  return actor;
}

function setActorAsset(actor,asset) {
  if(!asset || actor.active===asset) return;

  let image=actor.assets.get(asset.file);
  if(!image) {
    image=asset.image.cloneNode();
    image.alt=""; image.draggable=false;
    image.hidden=true;
    actor.assets.set(asset.file,image);
    actor.node.appendChild(image);
  }

  for(const other of actor.assets.values()) other.hidden=true;

  const b=asset.bounds;
  const scale=actor.width ? actor.width/b.w : actor.height/b.h;

  actor.visibleWidth=b.w*scale;
  actor.visibleHeight=b.h*scale;
  actor.node.style.width=actor.visibleWidth+"px";
  actor.node.style.height=actor.visibleHeight+"px";
  image.style.width=asset.image.naturalWidth*scale+"px";
  image.style.height=asset.image.naturalHeight*scale+"px";
  image.style.left=-b.x*scale+"px";
  image.style.top=-b.y*scale+"px";
  image.hidden=false;
  actor.active=asset;
  actor.node.hidden=false;
}

function placeActor(actor,x,y,offset=10) {
  actor.node.style.left=x+"px";
  actor.node.style.top=y+"px";
  actor.node.style.zIndex=Math.round(y*100+offset);
}

/* ==================== 15 · CARICAMENTO PERSONAGGI ==================== */
const playerAssets={idle:{},walk:{}};
player.actor=createActor(CONFIG.spriteHeight);

async function loadCharacters() {
  const jobs=[];

  for(const mode of ["idle","walk"]) {
    for(const direction of ["up","down","left","right"]) {
      jobs.push(loadAsset(PLAYER_FILES[mode][direction]).then(asset => {
        playerAssets[mode][direction]=asset;
      }));
    }
  }

  for(const data of NPC_DATA) {
    const person={
      ...data,radius:9,actor:createActor(54),
      animation:null,idleAssets:{}
    };
    npcs.push(person);

    jobs.push(loadAsset(data.gif).then(asset => {
      person.animation=asset;
      setActorAsset(person.actor,asset);
      placeActor(person.actor,person.x,person.y);
    }));

    // Caricati ma non mostrati: serviranno per i dialoghi.
    for(const direction of ["up","down","left","right"]) {
      jobs.push(loadAsset(data.idle[direction]).then(asset => {
        person.idleAssets[direction]=asset;
      }));
    }
  }

  await Promise.all(jobs);
}

const vehicleAssets={bus:[],car:[]};

async function loadVehicles() {
  const results=await Promise.all([
    Promise.all(BUS_FILES.map(loadAsset)),
    Promise.all(CAR_FILES.map(loadAsset))
  ]);
  vehicleAssets.bus=results[0].filter(Boolean);
  vehicleAssets.car=results[1].filter(Boolean);

/* ==================== 16 · PROFONDITÀ DEGLI OGGETTI ==================== */
function polygonPath(ctx,p) {
  ctx.beginPath();
  p.forEach(([x,y],i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y));
  ctx.closePath();
}

function makeDepthPiece(polygon,baseY) {
  const xs=polygon.map(p=>p[0]), ys=polygon.map(p=>p[1]);
  const x=Math.floor(Math.min(...xs)), y=Math.floor(Math.min(...ys));
  const w=Math.ceil(Math.max(...xs))-x;
  const h=Math.ceil(Math.max(...ys))-y;
  if(w<1 || h<1) return;

  const c=document.createElement("canvas");
  c.className="depth-piece";
  c.width=w; c.height=h;
  c.style.left=x+"px"; c.style.top=y+"px";
  c.style.zIndex=Math.round(baseY*100+30);

  const ctx=c.getContext("2d");
  ctx.imageSmoothingEnabled=false;
  ctx.translate(-x,-y);
  polygonPath(ctx,polygon);
  ctx.clip();
  ctx.drawImage(mapImage,0,0,CONFIG.width,CONFIG.height);
  scene.appendChild(c);
  depthNodes.push(c);
}

function rebuildDepth() {
  depthNodes.forEach(n=>n.remove());
  depthNodes=[];
  for(const z of world.depth) makeDepthPiece(z.polygon,z.baseY);

  // Elementi della pensilina davanti al treno.
  makeDepthPiece(rectangle(0,0,1024,55),145);
  makeDepthPiece(rectangle(328,55,20,90),145);
  makeDepthPiece(rectangle(660,55,28,90),145);
  makeDepthPiece(rectangle(1003,55,21,90),145);
}

function setupTrain() {

/* ==================== 18 · COLLISIONI STATICHE ==================== */
function pointInPolygon(x,y,p) {
  let inside=false;
  for(let i=0,j=p.length-1;i<p.length;j=i++) {
    const [xi,yi]=p[i], [xj,yj]=p[j];
    if((yi>y)!==(yj>y) && x<(xj-xi)*(y-yi)/(yj-yi)+xi) inside=!inside;
  }
  return inside;
}

function segmentDistanceSquared(x,y,a,b) {
  const dx=b[0]-a[0], dy=b[1]-a[1], length=dx*dx+dy*dy;
  const t=length ? clamp(((x-a[0])*dx+(y-a[1])*dy)/length,0,1) : 0;
  return (x-a[0]-t*dx)**2+(y-a[1]-t*dy)**2;
}

function hitsPolygon(x,y,r,p) {
  return pointInPolygon(x,y,p) || p.some((a,i) =>
    segmentDistanceSquared(x,y,a,p[(i+1)%p.length])<=r*r
  );
}

function circleRectangle(x,y,r,b) {
  const nx=clamp(x,b.left,b.right), ny=clamp(y,b.top,b.bottom);
  return (x-nx)**2+(y-ny)**2<=r*r;
}

function vehicleBounds(v,x=v.x) {
  return {
    left:x-v.width/2+5,
    right:x+v.width/2-5,
    top:v.y-v.hitHeight,
    bottom:v.y+2
  };
}

function staticFree(x,y) {
  const r=CONFIG.radius;
  return x>=r && y>=r && x<=CONFIG.width-r && y<=CONFIG.height-r &&
    !world.collisions.some(p=>hitsPolygon(x,y,r,p));
}

function canStand(x,y) {
  if(!staticFree(x,y)) return false;

  if(npcs.some(n=>Math.hypot(x-n.x,y-n.y)<CONFIG.radius+n.radius)) {
    return false;
  }
  return !vehicles.some(v=>circleRectangle(x,y,CONFIG.radius,vehicleBounds(v)));
}

function movePlayer(dx,dy) {
  const steps=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/2));
  for(let i=0;i<steps;i++) {
    if(canStand(player.x+dx/steps,player.y)) player.x+=dx/steps;
    if(canStand(player.x,player.y+dy/steps)) player.y+=dy/steps;
  }
}

/* ==================== 19 · TRAFFICO CASUALE ==================== */
function spawnVehicle(type) {
  const list=vehicleAssets[type], settings=CONFIG[type];
  if(!list.length) return false;

  const width=type==="car"
    ? settings.width*random(.94,1.08)
    : settings.width;

  // Lascia spazio libero all'ingresso della corsia.
  const occupied=vehicles.some(v =>
    v.type===type && v.x+v.width/2>CONFIG.width-70
  );
  if(occupied) return false;

  const asset=list[Math.floor(Math.random()*list.length)];
  const actor=createActor(1,width);
  setActorAsset(actor,asset);

  const vehicle={
    type,actor,width,x:CONFIG.width+width/2+15,
    y:settings.groundY,
    speed:random(settings.speedMin,settings.speedMax),
    hitHeight:settings.hitHeight
  };
  vehicles.push(vehicle);
  placeActor(actor,vehicle.x,vehicle.y);
  return true;
}

function rectanglesOverlap(a,b,gap=0) {
  return a.left<b.right+gap && a.right>b.left-gap &&
    a.top<b.bottom && a.bottom>b.top;
}

function updateTraffic(dt) {
  nextBus-=dt; nextCar-=dt;

  if(nextBus<=0) {
    nextBus=spawnVehicle("bus")
      ? random(CONFIG.bus.waitMin,CONFIG.bus.waitMax)
      : .5;
  }
  if(nextCar<=0) {
    nextCar=spawnVehicle("car")
      ? random(CONFIG.car.waitMin,CONFIG.car.waitMax)
      : .5;
  }

  // Chi è più avanti viene aggiornato per primo.
  const ordered=[...vehicles].sort((a,b)=>a.x-b.x);

  for(const v of ordered) {
    const distance=v.speed*dt;
    const steps=Math.max(1,Math.ceil(distance/2));

    for(let i=0;i<steps;i++) {
      const nx=v.x-distance/steps;
      const bounds=vehicleBounds(v,nx);

      const hitsPlayer=!intro &&
        circleRectangle(player.x,player.y,CONFIG.radius+2,bounds);

      const hitsNpc=npcs.some(n=>
        circleRectangle(n.x,n.y,n.radius,bounds)
      );

      const hitsVehicle=vehicles.some(other =>
        other!==v && other.type===v.type &&
        rectanglesOverlap(bounds,vehicleBounds(other),18)
      );

      // Si fermano prima di Riccardo o di un altro veicolo.
      if(hitsPlayer || hitsNpc || hitsVehicle) break;
      v.x=nx;
    }

    placeActor(v.actor,v.x,v.y);

    if(v.x+v.width/2<-25) {
      v.actor.node.remove();
      const actorIndex=actors.indexOf(v.actor);
      if(actorIndex>=0) actors.splice(actorIndex,1);
      vehicles.splice(vehicles.indexOf(v),1);
    }
  }
}

/* ==================== 20 · MOVIMENTO IN QUATTRO DIREZIONI ==================== */
const VECTORS={
  up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}
};
const KEY_DIRECTION={
  arrowup:"up",w:"up",arrowdown:"down",s:"down",
  arrowleft:"left",a:"left",arrowright:"right",d:"right"
};
const joystick={pointer:null,x:0,y:0,direction:null};

function press(token,direction) {
  heldInputs.delete(token);
  heldInputs.set(token,direction);
}
function currentDirection() {
  const values=[...heldInputs.values()];
  return values.at(-1)||null;
}
function resetInput() {
  heldInputs.clear();
  joystick.pointer=null;
  joystick.direction=null;
  $("joystick").hidden=true;
  $("stick").style.transform="";
  player.moving=false;
}

window.addEventListener("keydown",event=>{
  const direction=KEY_DIRECTION[event.key.toLowerCase()];
  if(!direction || !ready || intro || editor.open) return;
  event.preventDefault();
  if(!event.repeat) press("key:"+event.key.toLowerCase(),direction);
});
window.addEventListener("keyup",event=>{
  heldInputs.delete("key:"+event.key.toLowerCase());
});

function updateJoystick(event) {
  const dx=event.clientX-joystick.x, dy=event.clientY-joystick.y;
  const distance=Math.hypot(dx,dy), limit=34;
  let direction=null;

  if(distance>=10) {
    direction=Math.abs(dx)>Math.abs(dy)
      ? (dx>0?"right":"left")
      : (dy>0?"down":"up");
  }

  const vector=direction ? VECTORS[direction] : {x:0,y:0};
  const amount=Math.min(distance,limit);
  $("stick").style.transform=
    `translate(${vector.x*amount}px,${vector.y*amount}px)`;

  if(direction!==joystick.direction) {
    heldInputs.delete("touch");
    if(direction) press("touch",direction);
    joystick.direction=direction;
  }
}

game.addEventListener("pointerdown",event=>{
  if(event.target.closest("button") || !ready || intro || editor.open) return;
  if(joystick.pointer!==null) return;
  if(event.pointerType==="mouse" && event.button!==0) return;

  event.preventDefault();
  joystick.pointer=event.pointerId;
  joystick.x=event.clientX; joystick.y=event.clientY;

  const bounds=game.getBoundingClientRect();
  $("joystick").style.left=event.clientX-bounds.left+"px";
  $("joystick").style.top=event.clientY-bounds.top+"px";
  $("joystick").hidden=false;
  game.setPointerCapture(event.pointerId);
  updateJoystick(event);
});
game.addEventListener("pointermove",event=>{
  if(event.pointerId===joystick.pointer) updateJoystick(event);
});

function endJoystick(event) {
  if(event.pointerId!==joystick.pointer) return;
  heldInputs.delete("touch");
  joystick.pointer=null; joystick.direction=null;
  $("joystick").hidden=true;
  $("stick").style.transform="";
}
for(const name of ["pointerup","pointercancel","lostpointercapture"]) {
  game.addEventListener(name,endJoystick);
}
window.addEventListener("blur",resetInput);
document.addEventListener("visibilitychange",()=>{
  resetInput(); lastTime=0;
});

/* ==================== 21 · CAMERA E DISEGNO ==================== */
function updateCamera() {
  const w=viewWidth/zoom, h=viewHeight/zoom;
  camera.x=CONFIG.width>w
    ? clamp(player.x-w/2,0,CONFIG.width-w) : (CONFIG.width-w)/2;
  camera.y=CONFIG.height>h
    ? clamp(player.y-h/2,0,CONFIG.height-h) : (CONFIG.height-h)/2;

  scene.style.transform=
    `translate(${-camera.x*zoom}px,${-camera.y*zoom}px) scale(${zoom})`;
}

function resize() {
  const r=game.getBoundingClientRect();
  viewWidth=Math.max(1,r.width); viewHeight=Math.max(1,r.height);
  updateCamera();
}
new ResizeObserver(resize).observe(game);

$("zoomIn").onclick=()=>{
  zoom=clamp(zoom+.2,CONFIG.minZoom,CONFIG.maxZoom); updateCamera();
};
$("zoomOut").onclick=()=>{
  zoom=clamp(zoom-.2,CONFIG.minZoom,CONFIG.maxZoom); updateCamera();
};

function drawPlayer() {
  const mode=player.moving?"walk":"idle";
  const asset=playerAssets[mode][player.direction] ||
    playerAssets.idle[player.direction] || playerAssets.idle.down;

  setActorAsset(player.actor,asset);
  placeActor(player.actor,player.x,player.y,20);

  // Durante l'uscita, la testa emerge dall'apertura nera.
  const top=player.y-player.actor.visibleHeight;
  const cut=intro ? Math.max(0,325-top) : 0;
  player.actor.node.style.clipPath=cut ? `inset(${cut}px 0 0 0)` : "";
}

function returnToStation() {
  resetInput();
  player.x=CONFIG.entrance.x; player.y=CONFIG.entrance.y;
  player.direction="down"; player.moving=true; intro=true;
  updateCamera();
}
$("resetButton").onclick=returnToStation;

function updateStatus() {
  let text="Map test · no battles";
  if(missing.size) text="Missing image: "+[...missing][0];
  else if(intro) text="Arriving in Seoul…";
  else if(player.x>685 && player.x<840 && player.y>1465 && player.y<1510) {
    text="Job Center entrance · interior coming next";
  }
  if($("status").textContent!==text) $("status").textContent=text;
}

function tick(now) {
  const dt=lastTime ? Math.min((now-lastTime)/1000,.04) : 0;
  lastTime=now;

  if(ready && !editor.open && !document.hidden) {
    const oldX=player.x,oldY=player.y;

    if(intro) {
      player.direction="down";
      player.y=Math.min(CONFIG.start.y,player.y+75*dt);
      if(player.y>=CONFIG.start.y) intro=false;
    } else {
      const direction=currentDirection();
      if(direction) {
        player.direction=direction;
        const v=VECTORS[direction];
        movePlayer(v.x*CONFIG.speed*dt,v.y*CONFIG.speed*dt);
      }
    }

    player.moving=Math.hypot(player.x-oldX,player.y-oldY)>.0001;
    updateTraffic(dt);
    drawPlayer();
    updateCamera();
    updateStatus();
  }
  requestAnimationFrame(tick);
}

/* ==================== 22 · EDITOR: STATO E VISTA ==================== */
const editorCanvas=$("editorCanvas");
const editorCtx=editorCanvas.getContext("2d");
const editor={
  open:false,layer:"collision",tool:"pan",selected:-1,
  draft:[],history:[],drag:null,base:false,scale:1,x:0,y:0
};

const editorItems=()=>editor.layer==="collision" ? world.collisions : world.depth;
const itemPolygon=item=>editor.layer==="collision" ? item : item.polygon;

function setPolygon(index,p) {
  if(editor.layer==="collision") world.collisions[index]=p;
  else world.depth[index].polygon=p;
}
function remember(snapshot=JSON.stringify(world)) {
  editor.history.push(snapshot);
  if(editor.history.length>40) editor.history.shift();
}
function notice(text) { $("editorHint").textContent=text; }

function paintEditor() {
  if(!editor.open || !ready) return;

  const c=editorCtx,s=editor;
  c.setTransform(1,0,0,1,0,0);
  c.fillStyle="#10232d";
  c.fillRect(0,0,editorCanvas.width,editorCanvas.height);
  c.translate(s.x,s.y); c.scale(s.scale,s.scale);
  c.imageSmoothingEnabled=false;
  c.drawImage(mapImage,0,0,CONFIG.width,CONFIG.height);

  editorItems().forEach((item,index)=>{
    const p=itemPolygon(item), selected=index===s.selected;
    polygonPath(c,p);
    c.fillStyle=selected ? "#ffde7966" :
      s.layer==="collision" ? "#ff34545c" : "#40bfff60";
    c.fill();
    c.lineWidth=1.5/s.scale;
    c.strokeStyle=selected?"#ffe08a":"#ffffff88";
    c.stroke();

    if(!selected) return;
    for(const [x,y] of p) {
      c.fillStyle="white";
      c.fillRect(x-5/s.scale,y-5/s.scale,10/s.scale,10/s.scale);
    }
    if(s.layer==="depth") {
      const xs=p.map(v=>v[0]);
      c.beginPath();
      c.moveTo(Math.min(...xs)-15,item.baseY);
      c.lineTo(Math.max(...xs)+15,item.baseY);
      c.strokeStyle="#ffdf59"; c.lineWidth=2/s.scale; c.stroke();
      c.fillStyle="#ffdf59"; c.font=12/s.scale+"px Arial";
      c.fillText(item.name+" · BASE "+Math.round(item.baseY),
        Math.min(...xs),item.baseY-7/s.scale);
    }
  });

  if(s.draft.length) {
    c.beginPath();
    s.draft.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));
    c.strokeStyle="#7dffff"; c.lineWidth=2/s.scale; c.stroke();
    for(const [x,y] of s.draft) {
      c.fillStyle="#7dffff";
      c.fillRect(x-4/s.scale,y-4/s.scale,8/s.scale,8/s.scale);
    }
  }

  for(const n of npcs) {
    c.beginPath(); c.arc(n.x,n.y,n.radius,0,Math.PI*2);
    c.fillStyle="#ffcc69"; c.fill();
  }
  for(const v of vehicles) {
    const b=vehicleBounds(v);
    c.fillStyle="#b78cffaa";
    c.fillRect(b.left,b.top,b.right-b.left,b.bottom-b.top);
  }
  c.beginPath(); c.arc(player.x,player.y,7,0,Math.PI*2);
  c.fillStyle="white"; c.fill();
  c.beginPath(); c.arc(player.x,player.y,5,0,Math.PI*2);
  c.fillStyle="#ed243b"; c.fill();

  document.querySelectorAll("[data-layer]").forEach(b=>{
    b.classList.toggle("active",b.dataset.layer===s.layer);
  });
  document.querySelectorAll("[data-tool]").forEach(b=>{
    b.classList.toggle("active",b.dataset.tool===s.tool);
  });
  $("editorBase").disabled=s.layer!=="depth" || s.selected<0;

  const help=s.base
    ? "Tocca l’altezza della base dell’oggetto."
    : s.tool==="pan"
      ? "Trascina la mappa. Usa + e − per ingrandire."
      : s.tool==="draw"
        ? "Tocca gli angoli in ordine, poi Chiudi forma."
        : "Seleziona una forma. Trascina i punti bianchi o il suo interno.";

  notice(help+(s.layer==="depth"
    ? " Blu: contorno visivo. Giallo: base."
    : " Rosso: ostacoli. Arancione: NPC. Viola: veicoli.")+
    (storageFailed?" Salvataggio non disponibile: esporta i dati.":""));
}

function resizeEditor(fit=false) {
  if(!editor.open) return;
  editorCanvas.width=Math.max(1,$("editorView").clientWidth);
  editorCanvas.height=Math.max(1,$("editorView").clientHeight);
  if(fit) {
    editor.scale=Math.min(editorCanvas.width/CONFIG.width,
      editorCanvas.height/CONFIG.height)*.97;
    editor.x=(editorCanvas.width-CONFIG.width*editor.scale)/2;
    editor.y=(editorCanvas.height-CONFIG.height*editor.scale)/2;
  }
  paintEditor();
}
new ResizeObserver(()=>resizeEditor()).observe($("editorView"));

function zoomEditor(factor) {
  const x=editorCanvas.width/2,y=editorCanvas.height/2;
  const wx=(x-editor.x)/editor.scale,wy=(y-editor.y)/editor.scale;
  editor.scale=clamp(editor.scale*factor,.12,6);
  editor.x=x-wx*editor.scale; editor.y=y-wy*editor.scale;
  paintEditor();
}

$("editorOpen").onclick=()=>{
  if(!ready || intro) return;
  resetInput(); editor.open=true; editor.drag=null;
  $("editor").hidden=false; game.inert=true;

$("editorClose").onclick=()=>{
  if(editor.draft.length) {
    notice("Chiudi la forma oppure togli i punti con Annulla."); return;
  }

  // Se una modifica include Riccardo, cerca un punto libero vicino.
  if(!canStand(player.x,player.y)) {
    let found=false;
    for(let radius=10;radius<=180 && !found;radius+=10) {
      for(let angle=0;angle<Math.PI*2;angle+=Math.PI/12) {
        const x=player.x+Math.cos(angle)*radius;
        const y=player.y+Math.sin(angle)*radius;
        if(canStand(x,y)) {
          player.x=x; player.y=y; found=true; break;
        }
      }
    }
    if(!found) { notice("Libera un passaggio vicino al punto rosso."); return; }
  }

  saveWorld(); rebuildDepth();
  editor.open=false; editor.base=false;
  $("editor").hidden=true; game.inert=false;
  resetInput(); lastTime=0; updateCamera();
};

document.querySelectorAll("[data-layer]").forEach(button=>{

    paintEditor();
  };
});
document.querySelectorAll("[data-tool]").forEach(button=>{

/* ==================== 24 · EDITOR: VALIDAZIONE ==================== */
function shapeValid(p) {
  if(!validPolygon(p)) return false;
  const orient=(a,b,c)=>
    (b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);
  let area=0;

  for(let i=0;i<p.length;i++) {
    const a=p[i],b=p[(i+1)%p.length];
    area+=a[0]*b[1]-b[0]*a[1];
    if(a[0]===b[0] && a[1]===b[1]) return false;

    for(let j=i+1;j<p.length;j++) {
      if(j===i+1 || (i===0 && j===p.length-1)) continue;
      const c=p[j],d=p[(j+1)%p.length];
      const overlap=
        Math.max(Math.min(a[0],b[0]),Math.min(c[0],d[0]))<=
        Math.min(Math.max(a[0],b[0]),Math.max(c[0],d[0])) &&
        Math.max(Math.min(a[1],b[1]),Math.min(c[1],d[1]))<=
        Math.min(Math.max(a[1],b[1]),Math.max(c[1],d[1]));

      if(overlap &&
        orient(a,b,c)*orient(a,b,d)<=0 &&
        orient(c,d,a)*orient(c,d,b)<=0) return false;
    }
  }
  return Math.abs(area)/2>3;
}

$("editorFinish").onclick=()=>{
  if(!shapeValid(editor.draft)) {
    notice("Servono almeno tre punti, senza incroci nel contorno."); return;
  }
  remember();

  if(editor.layer==="collision") world.collisions.push(copy(editor.draft));
  else world.depth.push({
    name:"Oggetto "+(world.depth.length+1),
    baseY:Math.max(...editor.draft.map(p=>p[1])),
    polygon:copy(editor.draft)
  });

  editor.selected=editorItems().length-1;
  editor.draft=[]; editor.tool="edit";
  saveWorld(); paintEditor();
};

$("editorBase").onclick=()=>{
  if(editor.layer!=="depth" || editor.selected<0) return;
  editor.base=true; paintEditor();
};
$("editorUndo").onclick=()=>{
  editor.base=false;
  if(editor.draft.length) editor.draft.pop();
  else if(editor.history.length) {
    world=JSON.parse(editor.history.pop());
    editor.selected=-1; saveWorld();
  }
  paintEditor();
};
$("editorDelete").onclick=()=>{
  if(editor.selected<0) return;
  remember(); editorItems().splice(editor.selected,1);
  editor.selected=-1; editor.base=false;
  saveWorld(); paintEditor();
};

/* ==================== 25 · EDITOR: TOCCO E TRASCINAMENTO ==================== */
function screenPoint(event) {
  const r=editorCanvas.getBoundingClientRect();
  return {
    x:(event.clientX-r.left)*editorCanvas.width/r.width,
    y:(event.clientY-r.top)*editorCanvas.height/r.height
  };
}
function worldPoint(p) {
  return [
    Math.round(clamp((p.x-editor.x)/editor.scale,0,CONFIG.width)),
    Math.round(clamp((p.y-editor.y)/editor.scale,0,CONFIG.height))
  ];
}

editorCanvas.onpointerdown=event=>{
  if(editor.drag) return;
  event.preventDefault();
  editorCanvas.setPointerCapture(event.pointerId);

  const point=screenPoint(event),wp=worldPoint(point),s=editor;

  if(s.base && s.selected>=0) {
    remember(); world.depth[s.selected].baseY=wp[1]; s.base=false;
    saveWorld(); paintEditor(); return;
  }
  if(s.tool==="draw") {
    const previous=s.draft.at(-1);
    if(!previous || Math.hypot(wp[0]-previous[0],wp[1]-previous[1])>2) {
      s.draft.push(wp);
    }
    paintEditor(); return;
  }
  if(s.tool==="pan") {
    s.drag={id:event.pointerId,kind:"pan",point,x:s.x,y:s.y}; return;
  }

  if(s.selected>=0) {
    const p=itemPolygon(editorItems()[s.selected]);
    const vertex=p.findIndex(v=>
      Math.hypot(v[0]-wp[0],v[1]-wp[1])<16/s.scale
    );
    if(vertex>=0) {
      s.drag={
        id:event.pointerId,kind:"vertex",vertex,
        before:JSON.stringify(world)
      };
      return;
    }
  }

  s.selected=-1;
  const items=editorItems();
  for(let i=items.length-1;i>=0;i--) {
    if(pointInPolygon(wp[0],wp[1],itemPolygon(items[i]))) {
      s.selected=i; break;
    }
  }
  if(s.selected>=0) {
    s.drag={
      id:event.pointerId,kind:"shape",point:wp,
      original:copy(itemPolygon(items[s.selected])),
      originalBase:s.layer==="depth"?items[s.selected].baseY:null,
      before:JSON.stringify(world)
    };
  }
  paintEditor();
};

editorCanvas.onpointermove=event=>{
  const s=editor,d=s.drag;
  if(!d || d.id!==event.pointerId) return;
  const point=screenPoint(event),wp=worldPoint(point);

  if(d.kind==="pan") {
    s.x=d.x+point.x-d.point.x; s.y=d.y+point.y-d.point.y;
  } else if(d.kind==="vertex") {
    itemPolygon(editorItems()[s.selected])[d.vertex]=wp;
  } else {
    const xs=d.original.map(p=>p[0]),ys=d.original.map(p=>p[1]);
    const dx=clamp(wp[0]-d.point[0],-Math.min(...xs),CONFIG.width-Math.max(...xs));
    const dy=clamp(wp[1]-d.point[1],-Math.min(...ys),CONFIG.height-Math.max(...ys));
    setPolygon(s.selected,d.original.map(p=>[p[0]+dx,p[1]+dy]));
    if(s.layer==="depth") {
      world.depth[s.selected].baseY=clamp(d.originalBase+dy,0,CONFIG.height);
    }
  }
  paintEditor();
};

function finishDrag(event) {
  const s=editor,d=s.drag;
  if(!d || d.id!==event.pointerId) return;
  let invalid=false;

  if(d.before) {
    invalid=!shapeValid(itemPolygon(editorItems()[s.selected]));
    if(event.type==="pointercancel" || invalid) {
      world=JSON.parse(d.before);
    } else if(d.before!==JSON.stringify(world)) {
      remember(d.before); saveWorld();
    }
  }
  s.drag=null; paintEditor();
  if(invalid) notice("Contorno non valido: modifica annullata.");
}
editorCanvas.onpointerup=finishDrag;
editorCanvas.onpointercancel=finishDrag;
editorCanvas.onlostpointercapture=finishDrag;

/* ==================== 26 · ESPORTAZIONE ==================== */
$("editorExport").onclick=()=>{
  if(editor.draft.length) {
    notice("Termina prima la forma in corso."); return;
  }
  saveWorld();
  $("exportData").value=JSON.stringify({
    map:CONFIG.map,version:VERSION,
    collisions:world.collisions,depth:world.depth
  },null,2);
  $("exportPanel").hidden=false;
  $("exportCopy").textContent="Copia";
};

$("exportCopy").onclick=async function() {
  try {
    await navigator.clipboard.writeText($("exportData").value);
    this.textContent="Copiato!";
  } catch(_) {
    $("exportData").focus(); $("exportData").select();
    this.textContent="Seleziona e copia il testo";
  }
};
$("exportClose").onclick=()=>{ $("exportPanel").hidden=true; };

/* ==================== 27 · CARICAMENTO E AVVIO ==================== */
let loadingMap=false;

async function startGame(retry=false) {
  if(loadingMap) return;
  loadingMap=true; ready=false; resetInput();
  $("loading").hidden=false;
  $("loadingTitle").textContent="Loading Seoul…";
  $("loadingText").textContent="Please wait.";
  $("retryLoad").hidden=true;

  try {
    await new Promise((resolve,reject)=>{
      mapImage.onload=resolve;
      mapImage.onerror=reject;
      mapImage.src=CONFIG.map+(retry?"?retry="+Date.now():"");
    });

    if(!startGame.assetsStarted) {
      startGame.assetsStarted=true;
      await Promise.all([loadCharacters(),loadVehicles()]);
      setupTrain();
    }

    rebuildDepth();
    ready=true;
    $("loading").hidden=true;
    returnToStation();
    resize();
  } catch(_) {
    $("loadingTitle").textContent="Unable to load the map";
    $("loadingText").textContent=
      "Controlla che la mappa sia nella stessa cartella di index.html.";
    $("retryLoad").hidden=false;
  } finally {
    loadingMap=false;
  }
}

$("retryLoad").onclick=()=>startGame(true);
resize();
startGame();
requestAnimationFrame(tick);
</script>
