function loadAsset(file,fixed=false,child=false){
 const key=file+"|"+fixed+"|"+child;if(cache.has(key))return cache.get(key);
 const promise=new Promise(resolve=>{
  const image=new Image();image.onload=()=>{
   const w=image.naturalWidth,h=image.naturalHeight;
   let b={x:0,y:0,w,h},freeze=null;
   try{
    const c=document.createElement("canvas");c.width=w;c.height=h;
    const ctx=c.getContext("2d",{willReadFrequently:true});ctx.drawImage(image,0,0);
    freeze=c.toDataURL("image/png");
    if(!fixed){
     const data=ctx.getImageData(0,0,w,h).data;let l=w,t=h,r=-1,d=-1;
     for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(data[(y*w+x)*4+3]>=100){l=Math.min(l,x);r=Math.max(r,x);t=Math.min(t,y);d=Math.max(d,y);}
     if(r>=l)b={x:l,y:t,w:r-l+1,h:d-t+1};
    }
   }catch(_){}
   missing.delete(file);resolve({key,file,image,b,fixed,body:child?236:280,foot:fixed?h*292/304:b.y+b.h,freeze});
  };
  image.onerror=()=>{missing.add(file);resolve(null);};image.src=file;
 });cache.set(key,promise);return promise;
}

function pointInPolygon(x,y,p){let inside=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const [xi,yi]=p[i],[xj,yj]=p[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)inside=!inside;}return inside;}

   const i=(y*w+Math.floor(w*.25))*4;

// Shortest paths use the room's existing collisions; no walking through walls.
function cinematicPath(subject,target){
 const step=10,cols=Math.ceil(CONFIG.width/step),rows=Math.ceil(CONFIG.height/step),key=(x,y)=>y*cols+x;
 const start={x:Math.round(subject.x/step),y:Math.round(subject.y/step)},goal={x:Math.round(target.x/step),y:Math.round(target.y/step)};
 const allowed=(x,y)=>x>0&&y>0&&x<cols-1&&y<rows-1&&staticFree(x*step,y*step,subject.radius||9);
 let end=goal;if(!allowed(end.x,end.y)){const candidates=[];for(let dy=-6;dy<=6;dy++)for(let dx=-6;dx<=6;dx++)if(allowed(goal.x+dx,goal.y+dy))candidates.push({x:goal.x+dx,y:goal.y+dy,d:dx*dx+dy*dy});end=candidates.sort((a,b)=>a.d-b.d)[0];if(!end)throw Error('No free destination for morning scene');}
 const queue=[start],parents=new Map([[key(start.x,start.y),null]]);let found=null;
 for(let i=0;i<queue.length;i++){const p=queue[i];if(p.x===end.x&&p.y===end.y){found=p;break;}for(const [dx,dy]of [[1,0],[-1,0],[0,1],[0,-1]]){const x=p.x+dx,y=p.y+dy,k=key(x,y);if(parents.has(k)||!allowed(x,y))continue;parents.set(k,p);queue.push({x,y});}}
 if(!found)throw Error('No route for morning scene');const points=[];while(found){points.push({x:found.x*step,y:found.y*step});found=parents.get(key(found.x,found.y));}points.reverse();return points;

 }else{
