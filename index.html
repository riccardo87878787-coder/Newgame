function loadAsset(file,fixed=false,child=false){
 const key=file+"|"+fixed+"|"+child;if(cache.has(key))return cache.get(key);
 const promise=new Promise(resolve=>{
  const image=new Image();image.onload=()=>{
   const w=image.naturalWidth,h=image.naturalHeight;
   let b={x:0,y:0,w,h},freeze=null;
   try{
    const c=document.createElement("canvas");c.width=w;c.height=h;
    const ctx=c.getContext("2d",{willReadFrequently:true});ctx.drawImage(image,0,0);
    freeze=c.toDataURL("image/png");
    if(!fixed){
     const data=ctx.getImageData(0,0,w,h).data;let l=w,t=h,r=-1,d=-1;
     for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(data[(y*w+x)*4+3]>=100){l=Math.min(l,x);r=Math.max(r,x);t=Math.min(t,y);d=Math.max(d,y);}
     if(r>=l)b={x:l,y:t,w:r-l+1,h:d-t+1};
    }
   }catch(_){}
   missing.delete(file);resolve({key,file,image,b,fixed,body:child?236:280,foot:fixed?h*292/304:b.y+b.h,freeze});
  };
  image.onerror=()=>{missing.add(file);resolve(null);};image.src=file;
 });cache.set(key,promise);return promise;
}

}
function setAsset(actor,asset,paused=false){
 if(!asset)return;if(actor.active===asset&&actor.paused===paused)return;
 const key=asset.key+(paused&&asset.freeze?"|pause":"");let image=actor.images.get(key);
 if(!image){image=document.createElement("img");image.src=paused&&asset.freeze?asset.freeze:asset.file;image.alt="";image.draggable=false;actor.images.set(key,image);actor.node.appendChild(image);}
 for(const im of actor.images.values())im.hidden=im!==image;
 const b=asset.b,scale=actor.width?actor.width/b.w:actor.height/(asset.fixed?asset.body:b.h);
 const originX=asset.fixed?asset.image.naturalWidth/2:b.x+b.w/2;
 image.style.width=asset.image.naturalWidth*scale+"px";image.style.height=asset.image.naturalHeight*scale+"px";
 image.style.left=-originX*scale+"px";image.style.top=-asset.foot*scale+"px";

function pointInPolygon(x,y,p){let inside=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const [xi,yi]=p[i],[xj,yj]=p[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)inside=!inside;}return inside;}
function segmentDistance(x,y,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy,t=l?clamp(((x-a[0])*dx+(y-a[1])*dy)/l,0,1):0;return (x-a[0]-t*dx)**2+(y-a[1]-t*dy)**2;}
function hitsPolygon(x,y,r,p){return pointInPolygon(x,y,p)||p.some((a,i)=>segmentDistance(x,y,a,p[(i+1)%p.length])<=r*r);}
function circleRect(x,y,r,b){return (x-clamp(x,b.left,b.right))**2+(y-clamp(y,b.top,b.bottom))**2<=r*r;}
function vehicleBounds(v,x=v.x){return {left:x-v.width/2+5,right:x+v.width/2-5,top:v.y-v.hitHeight,bottom:v.y+2};}
function feet(n,x=n.x,y=n.y){const p=[{x,y,r:n.radius}];if(n.dog)p.push({x:x+(n.direction==="left"?-23:23),y,r:6});return p;}
function staticFree(x,y,r=CONFIG.radius){return x>=r&&y>=r&&x<=CONFIG.width-r&&y<=CONFIG.height-r&&!world.collisions.some(p=>hitsPolygon(x,y,r,p));}
function canOccupy(subject,x,y){
 for(const p of feet(subject,x,y)){
  if(!staticFree(p.x,p.y,p.r))return false;
  if(subject!==player&&!intro&&Math.hypot(p.x-player.x,p.y-player.y)<p.r+player.radius+2)return false;
  for(const n of npcs)if(n!==subject)for(const q of feet(n))if(Math.hypot(p.x-q.x,p.y-q.y)<p.r+q.r)return false;
  if(vehicles.some(v=>circleRect(p.x,p.y,p.r,vehicleBounds(v))))return false;
 }
 return true;
}
function moveEntity(subject,dx,dy){
 const steps=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/2));let moved=false;
 for(let i=0;i<steps;i++){const x=subject.x+dx/steps,y=subject.y+dy/steps;if(!canOccupy(subject,x,y))break;subject.x=x;subject.y=y;moved=true;}
 return moved;
}

function updateNpcs(dt){

   // Persona e cane invertono subito: nessuna sosta ai capi del percorso.
   target=n.route[n.target];dx=target[0]-n.x;dy=target[1]-n.y;distance=Math.hypot(dx,dy);

const originalDepth=rebuildDepth;rebuildDepth=function(){if(locationId==='city')originalDepth();else{depthNodes.forEach(n=>n.remove());depthNodes=[];for(const z of world.depth)makeDepth(z.polygon,z.baseY);}};
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function changeLocation(id){
 if(locked())return;resetInput();transitioning=true;const epoch=sceneEpoch;$('fade').classList.add('black');
 try{await Promise.all([wait(780),id==='office'?loadOfficeMap():Promise.resolve(),id==='office'?loadOfficeNpcs():Promise.resolve()]);if(epoch!==sceneEpoch)return;
 showLocation(id);const start=id==='office'?OFFICE.start:{x:755,y:1490};Object.assign(player,start,{direction:id==='office'?'up':'down'});zoom=id==='office'?OFFICE_VIEW.zoom:CONFIG.zoom;drawPlayer();updateCamera();await wait(100);
 }catch(error){$('status').textContent=error.message;}finally{if(epoch===sceneEpoch){$('fade').classList.remove('black');await wait(780);transitioning=false;}}
}
const originalTargets=allTargets;allTargets=function(){if(locationId==='city')return originalTargets();return npcs.map(owner=>({key:owner.id,type:'npc',owner,dog:false}));};
const originalPoint=targetPoint;targetPoint=function(t){if(t.type==='door')return locationId==='city'?{x:755,y:1488}:{x:510,y:1315};return originalPoint(t);};
const originalHead=targetHead;targetHead=function(t){if(t.type==='door'){const p=targetPoint(t);return{x:p.x,y:p.y-50};}return originalHead(t);};
const originalNear=nearTarget;nearTarget=function(t){if(t.type==='door')return doorNearby();if(locationId==='office'&&t.owner?.fixedFacing){const n=t.owner;if(n.y<580)return Math.abs(player.x-n.x)<65&&player.y>=585&&player.y<660;return Math.hypot(player.x-n.x,player.y-n.y)<65;}return originalNear(t);};
const originalInteract=interact;interact=function(t){if(locked()||intro||dialogue||!nearTarget(t))return;if(t.type==='door'){changeLocation(locationId==='city'?'office':'city');return;}if(t.owner?.id==='18_impiegata_principale'){startOfficeStory(t);return;}originalInteract(t);};
// Porta dedicata: area di attivazione sul marciapiede, indipendente dagli NPC.
function doorNearby(){return locationId==='city'?player.x>=660&&player.x<=850&&player.y>=1468&&player.y<=1536:player.x>=400&&player.x<=620&&player.y>=1235&&player.y<=1348;}
const doorButton=document.createElement('button'),doorIcon=document.createElement('img');doorButton.id='doorInteraction';doorButton.className='marker object';doorButton.hidden=true;doorIcon.src=UI_ASSETS.exclamation;doorIcon.alt='!';doorButton.appendChild(doorIcon);$('interactions').appendChild(doorButton);
doorIcon.onerror=()=>{doorIcon.hidden=true;doorButton.textContent='!';Object.assign(doorButton.style,{color:'#d92532',fontWeight:'900',fontSize:'30px',background:'#fff6df',border:'2px solid #68757f',borderRadius:'6px'});};
doorButton.onclick=e=>{e.preventDefault();e.stopPropagation();if(ready&&!intro&&!dialogue&&!editor.open&&!locked()&&doorNearby())changeLocation(locationId==='city'?'office':'city');};
function updateDoorMarker(){const show=ready&&!intro&&!dialogue&&!editor.open&&!locked()&&doorNearby();if(!show){doorButton.hidden=true;return;}const anchor=locationId==='city'?{x:755,y:1438}:{x:510,y:1260},p=screenPosition(anchor);doorButton.style.left=clamp(p.x,24,Math.max(24,viewWidth-24))+'px';doorButton.style.top=clamp(p.y,52,Math.max(52,viewHeight-25))+'px';doorButton.setAttribute('aria-label',locationId==='city'?'Enter Job Center':'Exit Job Center');setVisible(doorButton,true,doorIcon);}
const originalUI=updateInteractionUI;updateInteractionUI=function(){originalUI();updateDoorMarker();$('menuOpen').hidden=!ready||intro||dialogue||locked();};
/* 24 · DIALOGO PRINCIPALE, PENSIERO E CONSEGNA */
UI_ASSETS.thought='icons/file_000000006f608209b1c6d6380111193e.png';
const OFFICE_STORY=[
 {speaker:'npc',text:'리카르도 씨 맞으시죠? 보내 주신 이력서와 경력 사항은 미리 검토해 두었습니다.'},
 {speaker:'npc',text:'마침 리카르도 씨의 경력과 희망 조건에 상당히 부합하는 구인 공고가 있어서 소개해 드리려고 합니다.'},
 {speaker:'npc',text:'여기서 그리 멀지 않은 식당인데요, 주방에서 조리를 담당해 주실 경력직 요리사를 채용하고 있습니다.'},
 {speaker:'npc',text:'세부적인 근무 조건은 면접 시 협의하시면 되고요. 괜찮으시면 담당자에게 연락해서 면접 일정을 잡아 드릴까요?'},
 {speaker:'question'}, {speaker:'player',text:'저… 한국말… 잘… 말해요 못해요…'},
 {speaker:'npc',text:'네? 한국어를 못하신다고요? 아니, 여긴 비디오 게임이잖아요!'},
 {speaker:'npc',text:'이런 건 금방 해결할 수 있어요. 휴대폰 좀 줘 보세요.'},
 {speaker:'thought',text:'I didn’t understand a word… but I think she wants my phone.'},
 {speaker:'narration',text:'Riccardo hands his phone to the woman behind the counter.'}
];
function startOfficeStory(target){resetInput();target.owner.talking=true;player.direction='up';officeSequence={index:0,target,pause:0};showOfficePage();}
function showOfficePage(){const q=officeSequence;if(!q)return;const page=OFFICE_STORY[q.index];if(!page){officeSequence=null;dialogue=null;runAutomaticMenu();return;}if(page.speaker==='question'){dialogue=null;$('speech').hidden=true;reactionTime=1.5;q.pause=1.5;return;}openSpeech([page.text],{type:page.speaker==='npc'?'npc':'story',target:q.target});dialogue.officeStory=true;$('speech').classList.toggle('thought',page.speaker==='thought');$('speech').classList.toggle('narration',page.speaker==='narration');}
function updateOfficeSequence(dt){if(officeSequence?.pause>0){officeSequence.pause-=dt;if(officeSequence.pause<=0){reactionTime=0;officeSequence.index++;showOfficePage();}}}
const originalAdvance=advanceSpeech;advanceSpeech=function(){if(dialogue?.officeStory){dialogue=null;$('speech').hidden=true;$('speech').classList.remove('thought','narration');officeSequence.index++;showOfficePage();updateInteractionUI();return;}originalAdvance();};
const originalSpeech=openSpeech;openSpeech=function(lines,options={}){$('speech').classList.remove('thought','narration');originalSpeech(lines,options);};
/* 25 · DATI PERSONAGGI INDIPENDENTI DALLE QUATTRO POSIZIONI */
const LIMITS={level:99,hp:9999,ep:5000,won:999999999};
const partyMembers={riccardo:{name:{ko:'리카르도',en:'Riccardo'},level:1,hp:250,maxHp:250,ep:100,maxEp:100,card:'Menu/file_000000002b388209a33ce587676f6016.png'}};
const partySlots=['riccardo',null,null,null];let won=50000,language='ko';
function updateMember(id,patch){const member=partyMembers[id];if(!member)return;Object.assign(member,patch);member.level=clamp(Math.trunc(member.level)||1,1,LIMITS.level);member.maxHp=clamp(Math.trunc(member.maxHp)||1,1,LIMITS.hp);member.maxEp=clamp(Math.trunc(member.maxEp)||0,0,LIMITS.ep);member.hp=clamp(Math.trunc(member.hp)||0,0,member.maxHp);member.ep=clamp(Math.trunc(member.ep)||0,0,member.maxEp);renderMenu();}
function assignMember(slot,id){if(slot<0||slot>3||id!==null&&!partyMembers[id])return;const old=partySlots.indexOf(id);if(id&&old>=0)partySlots[old]=null;partySlots[slot]=id;renderMenu();}
function changeWon(amount){won=clamp(won+Math.trunc(amount||0),0,LIMITS.won);renderMenu();}
window.TaraiParty={members:partyMembers,slots:partySlots,updateMember,assignMember,changeWon,getWon:()=>won};
const MENU_TEXT={ko:['아이템','스킬','장비','상태','대형','저장','설정','언어'],en:['Item','Skills','Equip','Status','Form','Save','Options','Language']};
function renderMenu(){
 $('partySlots').replaceChildren();for(const id of partySlots){const slot=document.createElement('div');slot.className='party-slot';$('partySlots').appendChild(slot);if(!id)continue;const m=partyMembers[id],card=document.createElement('div');card.className='member-card';const img=document.createElement('img');img.src=m.card;img.alt='';card.appendChild(img);const data=document.createElement('div');data.className='member-data';const name=document.createElement('strong');name.textContent=m.name[language];data.appendChild(name);for(const value of [(language==='ko'?'레벨 ':'Lv ')+m.level,'HP '+m.hp+'/'+m.maxHp,'EP '+m.ep+'/'+m.maxEp]){const row=document.createElement('div');row.className='stat-row';row.textContent=value;data.appendChild(row);if(value.startsWith('HP')||value.startsWith('EP')){const meter=document.createElement('div'),fill=document.createElement('span'),ep=value.startsWith('EP');meter.className='meter'+(ep?' ep':'');fill.style.width=(ep?(m.maxEp?m.ep/m.maxEp:0):m.hp/m.maxHp)*100+'%';meter.appendChild(fill);data.appendChild(meter);}}card.appendChild(data);slot.appendChild(card);}
 $('menuNav').replaceChildren();MENU_TEXT[language].forEach((text,index)=>{const b=document.createElement('button');b.textContent=text;b.dataset.menuIndex=index;b.onclick=()=>{if(autoMenu)return;if(index===7)openLanguage();else if(index===5){try{localStorage.setItem('tarai-party-v1',JSON.stringify({members:partyMembers,slots:partySlots,won,language}));b.textContent=language==='ko'?'저장 완료':'Saved';}catch(_){b.textContent=language==='ko'?'저장 실패':'Save failed';}}};$('menuNav').appendChild(b);});
 $('wallet').textContent=new Intl.NumberFormat(language==='ko'?'ko-KR':'en-US').format(won)+' ₩';$('menuClose').textContent=language==='ko'?'닫기':'Close';$('languageTitle').textContent=language==='ko'?'언어':'Language';$('languageBack').textContent=language==='ko'?'뒤로':'Back';$('menuOpen').textContent=language==='ko'?'메뉴':'Menu';document.querySelectorAll('[data-language]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.language===language)));
}
function openMenu(){if(ending||transitioning||intro||dialogue)return;resetInput();menuOpen=true;renderMenu();$('rpgMenu').hidden=false;$('languagePage').hidden=true;clearMarkers();}
function closeMenu(){if(autoMenu)return;menuOpen=false;$('rpgMenu').hidden=true;resetInput();}
function openLanguage(){$('languagePage').hidden=false;renderMenu();}
$('menuOpen').onclick=openMenu;$('menuClose').onclick=closeMenu;$('languageBack').onclick=()=>{if(!autoMenu)$('languagePage').hidden=true;};
document.querySelectorAll('[data-language]').forEach(b=>b.onclick=()=>{if(!autoMenu){language=b.dataset.language;renderMenu();}});
async function runAutomaticMenu(){const epoch=sceneEpoch;openMenu();autoMenu=true;$('rpgMenu').classList.add('auto');const step=async ms=>{await wait(ms);return epoch===sceneEpoch;};if(!await step(900))return;$('menuNav').lastElementChild.classList.add('auto-focus');if(!await step(850))return;openLanguage();if(!await step(950))return;document.querySelector('[data-language="en"]').classList.add('auto-focus');if(!await step(650))return;language='en';renderMenu();if(!await step(1000))return;document.querySelector('[data-language="en"]').classList.remove('auto-focus');autoMenu=false;closeMenu();ending=true;officeNpcs.forEach(n=>n.talking=false);$('status').textContent='To be continued · ↺ Restart';resetInput();clearMarkers();}
/* 26 · RESET COMPLETO E SALVATAGGI DISTINTI PER MAPPA */
const originalSave=saveWorld;saveWorld=function(){if(locationId==='city')originalSave();else{officeWorld=world;try{localStorage.setItem('tarai-office-world-v1',JSON.stringify(world));storageFailed=false;}catch(_){storageFailed=true;}}};
try{const saved=JSON.parse(localStorage.getItem('tarai-office-world-v1'));if(validWorld(saved))officeWorld=saved;}catch(_){}
const originalLoadCharacters=loadCharacters;loadCharacters=async function(){await originalLoadCharacters();cityNpcs.push(...npcs);cityWorld=world;};
const originalBegin=beginIntro;beginIntro=function(){sceneEpoch++;officeSequence=null;dialogue=null;ending=false;transitioning=false;autoMenu=false;menuOpen=false;language='ko';won=50000;Object.assign(partyMembers.riccardo,{level:1,hp:250,maxHp:250,ep:100,maxEp:100});$('rpgMenu').hidden=true;$('rpgMenu').classList.remove('auto');$('fade').classList.remove('black');$('speech').classList.remove('thought','narration');if(locationId==='office')showLocation('city');for(const n of [...cityNpcs,...officeNpcs])n.talking=false;renderMenu();originalBegin();};
const originalStatus=updateStatus;updateStatus=function(){if(ending){$('status').textContent='To be continued · ↺ Restart';return;}if(locationId==='office'){$('status').textContent=missing.size?'Missing image: '+[...missing][0]:'Job Center';return;}originalStatus();};
// Il reset rimane l'unico controllo disponibile alla fine della prova.
for(const id of ['editorOpen','zoomIn','zoomOut']){const fn=$(id).onclick;$(id).onclick=()=>{if(!locked())fn();};}

/* 21 · AVVIO */
let loadingMap=false,assetsStarted=false;
async function startGame(retry=false){
 if(loadingMap)return;loadingMap=true;ready=false;resetInput();$("loading").hidden=false;$("loadingTitle").textContent="Loading Seoul…";$("loadingText").textContent="Please wait.";$("retryLoad").hidden=true;
 try{
  await new Promise((resolve,reject)=>{mapImage.onload=resolve;mapImage.onerror=reject;mapImage.src=CONFIG.map+(retry?"?retry="+Date.now():"");});
  if(!assetsStarted){assetsStarted=true;await Promise.all([loadCharacters(),loadVehicles()]);setupTrain();}
  rebuildDepth();for(const n of npcs){nearestFree(n);drawNpc(n);}ready=true;$("loading").hidden=true;resize();beginIntro();
 }catch(_){$("loadingTitle").textContent="Unable to load the map";$("loadingText").textContent="Controlla il nome della mappa e la sua posizione accanto a index.html.";$("retryLoad").hidden=false;}finally{loadingMap=false;}
}
$("retryLoad").onclick=()=>startGame(true);resize();startGame();requestAnimationFrame(tick);
</script>
