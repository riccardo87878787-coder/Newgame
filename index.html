function loadAsset(file,fixed=false,child=false){
 const key=file+"|"+fixed+"|"+child;if(cache.has(key))return cache.get(key);
 const promise=new Promise(resolve=>{
  const image=new Image();image.onload=()=>{
   const w=image.naturalWidth,h=image.naturalHeight;
   let b={x:0,y:0,w,h},freeze=null;
   try{
    const c=document.createElement("canvas");c.width=w;c.height=h;
    const ctx=c.getContext("2d",{willReadFrequently:true});ctx.drawImage(image,0,0);
    freeze=c.toDataURL("image/png");
    if(!fixed){
     const data=ctx.getImageData(0,0,w,h).data;let l=w,t=h,r=-1,d=-1;
     for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(data[(y*w+x)*4+3]>=100){l=Math.min(l,x);r=Math.max(r,x);t=Math.min(t,y);d=Math.max(d,y);}
     if(r>=l)b={x:l,y:t,w:r-l+1,h:d-t+1};
    }
   }catch(_){}
   missing.delete(file);resolve({key,file,image,b,fixed,body:child?236:280,foot:fixed?h*292/304:b.y+b.h,freeze});
  };
  image.onerror=()=>{missing.add(file);resolve(null);};image.src=file;
 });cache.set(key,promise);return promise;
}
function createActor(height=54,width=null){
 const node=document.createElement("div");node.className="actor";node.hidden=true;scene.appendChild(node);

}
function setAsset(actor,asset,paused=false){
 if(!asset)return;if(actor.active===asset&&actor.paused===paused){actor.node.hidden=false;return;}
 const key=asset.key+(paused&&asset.freeze?"|pause":"");let image=actor.images.get(key);
 if(!image){image=document.createElement("img");image.src=paused&&asset.freeze?asset.freeze:asset.file;image.alt="";image.draggable=false;actor.images.set(key,image);actor.node.appendChild(image);}
 for(const im of actor.images.values())im.hidden=im!==image;
 const b=asset.b,scale=actor.width?actor.width/b.w:actor.height/(asset.fixed?asset.body:b.h);
 const originX=asset.fixed?asset.image.naturalWidth/2:b.x+b.w/2;
 image.style.width=asset.image.naturalWidth*scale+"px";image.style.height=asset.image.naturalHeight*scale+"px";
 image.style.left=-originX*scale+"px";image.style.top=-asset.foot*scale+"px";
 actor.visibleHeight=(asset.foot-b.y)*scale;actor.active=asset;actor.paused=paused;actor.node.hidden=false;
}

/* 12 · COLLISIONI STATICHE E MOBILI */
function pointInPolygon(x,y,p){let inside=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const [xi,yi]=p[i],[xj,yj]=p[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)inside=!inside;}return inside;}
function segmentDistance(x,y,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy,t=l?clamp(((x-a[0])*dx+(y-a[1])*dy)/l,0,1):0;return (x-a[0]-t*dx)**2+(y-a[1]-t*dy)**2;}
function hitsPolygon(x,y,r,p){return pointInPolygon(x,y,p)||p.some((a,i)=>segmentDistance(x,y,a,p[(i+1)%p.length])<=r*r);}
function circleRect(x,y,r,b){return (x-clamp(x,b.left,b.right))**2+(y-clamp(y,b.top,b.bottom))**2<=r*r;}
function vehicleBounds(v,x=v.x){return {left:x-v.width/2+5,right:x+v.width/2-5,top:v.y-v.hitHeight,bottom:v.y+2};}
function feet(n,x=n.x,y=n.y){const p=[{x,y,r:n.radius}];if(n.dog)p.push({x:x+(n.direction==="left"?-23:23),y,r:6});return p;}
function staticFree(x,y,r=CONFIG.radius){return x>=r&&y>=r&&x<=CONFIG.width-r&&y<=CONFIG.height-r&&!world.collisions.some(p=>hitsPolygon(x,y,r,p));}
function canOccupy(subject,x,y){
 for(const p of feet(subject,x,y)){
  if(!staticFree(p.x,p.y,p.r))return false;
  if(subject!==player&&!intro&&Math.hypot(p.x-player.x,p.y-player.y)<p.r+player.radius+2)return false;
  for(const n of npcs)if(n!==subject)for(const q of feet(n))if(Math.hypot(p.x-q.x,p.y-q.y)<p.r+q.r)return false;
  if(locationId==='city'&&vehicles.some(v=>circleRect(p.x,p.y,p.r,vehicleBounds(v))))return false;
 }
 return true;
}
function moveEntity(subject,dx,dy){
 const steps=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/2));let moved=false;
 for(let i=0;i<steps;i++){const x=subject.x+dx/steps,y=subject.y+dy/steps;if(!canOccupy(subject,x,y))break;subject.x=x;subject.y=y;moved=true;}
 return moved;
}

function drawNpc(n){
 let a,paused=false;
 if(n.talking&&!dialogue?.target?.dog)a=n.idleAssets[n.direction];
 else if(n.route){a=n.walkAssets[n.direction];paused=!n.moving||n.talking;}
 else a=n.animation;
 if(!a)a=n.animation||n.walkAssets[n.direction]||n.idleAssets[n.direction]||Object.values(n.idleAssets).find(Boolean);

}
function updateNpcs(dt){
 for(const n of npcs){
  if(n.talking||!n.route){drawNpc(n);continue;}
  n.moving=false;
  if(n.wait>0){n.wait-=dt;drawNpc(n);continue;}
  let target=n.route[n.target],dx=target[0]-n.x,dy=target[1]-n.y,distance=Math.hypot(dx,dy);
  if(distance<.1){
   n.target=1-n.target;n.blocked=0;
   if(!n.dog){n.wait=random(1,3);drawNpc(n);continue;}
   // Persona e cane invertono subito: nessuna sosta ai capi del percorso.
   target=n.route[n.target];dx=target[0]-n.x;dy=target[1]-n.y;distance=Math.hypot(dx,dy);
  }
  n.direction=facing(dx,dy);
  const step=Math.min(distance,n.speed*dt),v=VECTORS[n.direction];
  n.moving=moveEntity(n,v.x*step,v.y*step);n.blocked=n.moving?0:n.blocked+dt;
  if(n.blocked>1.5){n.target=1-n.target;n.wait=n.dog?0:random(.5,1.2);n.blocked=0;}
  drawNpc(n);
 }
}

function overlap(a,b,gap=0){return a.left<b.right+gap&&a.right>b.left-gap&&a.top<b.bottom&&a.bottom>b.top;}

 if(nextCar<=0)nextCar=spawnVehicle("car")?random(CONFIG.car.waitMin,CONFIG.car.waitMax):.5;
 for(const v of [...vehicles].sort((a,b)=>a.x-b.x)){
  const distance=v.speed*dt,steps=Math.max(1,Math.ceil(distance/2));
  for(let i=0;i<steps;i++){
   const nx=v.x-distance/steps,b=vehicleBounds(v,nx);
   const blocked=(!intro&&circleRect(player.x,player.y,player.radius+2,b))||npcs.some(n=>feet(n).some(p=>circleRect(p.x,p.y,p.r,b)))||vehicles.some(o=>o!==v&&o.type===v.type&&overlap(b,vehicleBounds(o),18));
   if(blocked)break;v.x=nx;
  }

  if(v.x+v.width/2<-25){v.actor.node.remove();vehicles.splice(vehicles.indexOf(v),1);}
 }

];
function nearbyPortal(){return PORTALS.find(p=>p.from===locationId&&Math.hypot(player.x-p.x,player.y-p.y)<p.r);}
async function useCucchiaioPortal(p){if(locked()||intro||dialogue||editor.open||p.from!==locationId)return;resetInput();transitioning=true;const epoch=sceneEpoch;$('fade').classList.add('black');try{await Promise.all([wait(780),isInterior(p.to)?loadInteriorImage(p.to):loadHongdeonMap(),loadDoorSprites()]);if(epoch!==sceneEpoch)return;saveWorld();showLocation(p.to);Object.assign(player,p.spawn,{direction:p.direction,moving:false});nearestFree(player);zoom=CONFIG.zoom;drawPlayer();updateCamera();await wait(100);}catch(e){$('status').textContent=e.message;notice(e.message);}finally{if(epoch===sceneEpoch){$('fade').classList.remove('black');await wait(780);transitioning=false;}}}
const portalButton=document.createElement('button');portalButton.className='marker object';portalButton.textContent='!';portalButton.hidden=true;Object.assign(portalButton.style,{background:'#fff6df',color:'#d92532',fontWeight:'900',fontSize:'28px'});$('interactions').appendChild(portalButton);portalButton.onclick=e=>{e.stopPropagation();const p=nearbyPortal();if(p)useCucchiaioPortal(p);};
const uiBeforeCucchiaio=updateInteractionUI;updateInteractionUI=function(){uiBeforeCucchiaio();if(isInterior(locationId))doorButton.hidden=true;const p=nearbyPortal();portalButton.hidden=!p||!ready||intro||!!dialogue||editor.open||locked();if(!portalButton.hidden){const pos=screenPosition({x:p.x,y:p.y-65});portalButton.style.left=clamp(pos.x,24,viewWidth-24)+'px';portalButton.style.top=clamp(pos.y,52,viewHeight-25)+'px';portalButton.setAttribute('aria-label',p.label);}};
const travelBeforeCucchiaio=updateTravel;updateTravel=function(dt){travelBeforeCucchiaio(dt);if(isInterior(locationId))testHongButton.hidden=true;updateRoomDoors(dt);};
const exportBeforeCucchiaio=$('editorExport').onclick;$('editorExport').onclick=()=>{if(!isInterior(locationId))return exportBeforeCucchiaio();if(editor.draft.length){notice('Termina prima la forma.');return;}saveWorld();$('exportData').value=JSON.stringify({map:CUCCHIAIO[locationId].map,version:CUCCHIAIO_VERSION,width:1024,height:1536,collisions:world.collisions,depth:world.depth},null,2);$('exportPanel').hidden=false;$('exportCopy').textContent='Copia';};

/* Visuale di gioco fissa al limite più lontano già previsto. */
const cameraBeforeFixedZoom=updateCamera;
updateCamera=function(){if(!intro){const factor=locationId==='office'?CONFIG.spriteHeight/OFFICE_VIEW.playerHeight:locationId==='hongdeon'?CONFIG.spriteHeight/HONGDEON.playerHeight:1;zoom=CONFIG.minZoom*factor;}cameraBeforeFixedZoom();};
for(const id of ['zoomIn','zoomOut']){$(id).hidden=true;$(id).style.display='none';$(id).onclick=null;}

/* 21 · AVVIO */
let loadingMap=false,assetsStarted=false;
async function startGame(retry=false){
 if(loadingMap)return;loadingMap=true;ready=false;resetInput();$("loading").hidden=false;$("loadingTitle").textContent="Loading Seoul…";$("loadingText").textContent="Please wait.";$("retryLoad").hidden=true;
 try{
  await new Promise((resolve,reject)=>{mapImage.onload=resolve;mapImage.onerror=reject;mapImage.src=CONFIG.map+(retry?"?retry="+Date.now():"");});
  if(!assetsStarted){assetsStarted=true;await Promise.all([loadCharacters(),loadVehicles()]);setupTrain();}
  rebuildDepth();for(const n of npcs){nearestFree(n);drawNpc(n);}ready=true;$("loading").hidden=true;resize();beginIntro();
 }catch(_){$("loadingTitle").textContent="Unable to load the map";$("loadingText").textContent="Controlla il nome della mappa e la sua posizione accanto a index.html.";$("retryLoad").hidden=false;}finally{loadingMap=false;}
}
$("retryLoad").onclick=()=>startGame(true);resize();startGame();requestAnimationFrame(tick);
</script>
