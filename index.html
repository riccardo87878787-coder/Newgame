<style>
/* 01 · SCHERMO E LIVELLI */

/* 22 · MENU MODULARE E TRANSIZIONI */
.marker img{width:32px;height:32px;margin:8px auto}.marker{width:44px;height:44px;min-width:44px;min-height:44px}#reaction{width:32px;height:32px}

<style>
/* PRIMO COMBATTIMENTO · area di battaglia 2/3, comandi 1/3 */
#battleScreen{position:absolute;inset:0;z-index:35;background:#03091e;color:#fff3d8;font-family:Georgia,serif;container-type:size;isolation:isolate}

function loadAsset(file,fixed=false,child=false){
 const key=file+"|"+fixed+"|"+child;if(cache.has(key))return cache.get(key);
 const promise=new Promise(resolve=>{
  const image=new Image();image.onload=()=>{
   const w=image.naturalWidth,h=image.naturalHeight;
   let b={x:0,y:0,w,h},freeze=null;
   try{
    const c=document.createElement("canvas");c.width=w;c.height=h;
    const ctx=c.getContext("2d",{willReadFrequently:true});ctx.drawImage(image,0,0);
    freeze=c.toDataURL("image/png");
    if(!fixed){
     const data=ctx.getImageData(0,0,w,h).data;let l=w,t=h,r=-1,d=-1;
     for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(data[(y*w+x)*4+3]>=100){l=Math.min(l,x);r=Math.max(r,x);t=Math.min(t,y);d=Math.max(d,y);}
     if(r>=l)b={x:l,y:t,w:r-l+1,h:d-t+1};
    }
   }catch(_){}
   missing.delete(file);resolve({key,file,image,b,fixed,body:child?236:280,foot:fixed?h*292/304:b.y+b.h,freeze});
  };
  image.onerror=()=>{missing.add(file);resolve(null);};image.src=file;
 });cache.set(key,promise);return promise;
}
function createActor(height=54,width=null){

function setAsset(actor,asset,paused=false){
 if(!asset)return;if(actor.active===asset&&actor.paused===paused){actor.node.hidden=false;return;}
 const key=asset.key+(paused&&asset.freeze?"|pause":"");let image=actor.images.get(key);
 if(!image){image=document.createElement("img");image.src=paused&&asset.freeze?asset.freeze:asset.file;image.alt="";image.draggable=false;actor.images.set(key,image);actor.node.appendChild(image);}
 for(const im of actor.images.values())im.hidden=im!==image;
 const b=asset.b,scale=actor.width?actor.width/b.w:actor.height/(asset.fixed?asset.body:b.h);
 const originX=asset.fixed?asset.image.naturalWidth/2:b.x+b.w/2;
 image.style.width=asset.image.naturalWidth*scale+"px";image.style.height=asset.image.naturalHeight*scale+"px";
 image.style.left=-originX*scale+"px";image.style.top=-asset.foot*scale+"px";

}

function pointInPolygon(x,y,p){let inside=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const [xi,yi]=p[i],[xj,yj]=p[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)inside=!inside;}return inside;}
function segmentDistance(x,y,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy,t=l?clamp(((x-a[0])*dx+(y-a[1])*dy)/l,0,1):0;return (x-a[0]-t*dx)**2+(y-a[1]-t*dy)**2;}
function hitsPolygon(x,y,r,p){return pointInPolygon(x,y,p)||p.some((a,i)=>segmentDistance(x,y,a,p[(i+1)%p.length])<=r*r);}
function circleRect(x,y,r,b){return (x-clamp(x,b.left,b.right))**2+(y-clamp(y,b.top,b.bottom))**2<=r*r;}
function vehicleBounds(v,x=v.x){return {left:x-v.width/2+5,right:x+v.width/2-5,top:v.y-v.hitHeight,bottom:v.y+2};}
function feet(n,x=n.x,y=n.y){const p=[{x,y,r:n.radius}];if(n.dog)p.push({x:x+(n.direction==="left"?-23:23),y,r:6});return p;}
function staticFree(x,y,r=CONFIG.radius){return x>=r&&y>=r&&x<=CONFIG.width-r&&y<=CONFIG.height-r&&!world.collisions.some(p=>hitsPolygon(x,y,r,p));}
function canOccupy(subject,x,y){
 for(const p of feet(subject,x,y)){
  if(!staticFree(p.x,p.y,p.r))return false;
  if(subject!==player&&!intro&&Math.hypot(p.x-player.x,p.y-player.y)<p.r+player.radius+2)return false;
  for(const n of npcs)if(n!==subject)for(const q of feet(n))if(Math.hypot(p.x-q.x,p.y-q.y)<p.r+q.r)return false;
  if(locationId==='city'&&vehicles.some(v=>circleRect(p.x,p.y,p.r,vehicleBounds(v))))return false;
 }
 return true;
}
function moveEntity(subject,dx,dy){
 const steps=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/2));let moved=false;
 for(let i=0;i<steps;i++){const x=subject.x+dx/steps,y=subject.y+dy/steps;if(!canOccupy(subject,x,y))break;subject.x=x;subject.y=y;moved=true;}
 return moved;
}

 let a,paused=false;
 if(n.talking&&!dialogue?.target?.dog)a=n.idleAssets[n.direction];
 else if(n.route){a=n.walkAssets[n.direction];paused=!n.moving||n.talking;}
 else a=n.animation;
 if(!a)a=n.animation||n.walkAssets[n.direction]||n.idleAssets[n.direction]||Object.values(n.idleAssets).find(Boolean);

function updateNpcs(dt){

  if(n.talking||!n.route){drawNpc(n);continue;}
  n.moving=false;
  if(n.wait>0){n.wait-=dt;drawNpc(n);continue;}
  let target=n.route[n.target],dx=target[0]-n.x,dy=target[1]-n.y,distance=Math.hypot(dx,dy);
  if(distance<.1){
   n.target=1-n.target;n.blocked=0;
   if(!n.dog){n.wait=random(1,3);drawNpc(n);continue;}
   // Persona e cane invertono subito: nessuna sosta ai capi del percorso.
   target=n.route[n.target];dx=target[0]-n.x;dy=target[1]-n.y;distance=Math.hypot(dx,dy);
  }
  n.direction=facing(dx,dy);
  const step=Math.min(distance,n.speed*dt),v=VECTORS[n.direction];
  n.moving=moveEntity(n,v.x*step,v.y*step);n.blocked=n.moving?0:n.blocked+dt;

 const image=balloonSkinImages.find(im=>im.src===new URL(UI_ASSETS.dialogue,location.href).href);
 if(!image?.naturalWidth)return;
 try{
  const w=image.naturalWidth,h=image.naturalHeight,slice=110;
  if(w<=200||h<=180)return;
  const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(image,0,0);
  const data=ctx.getImageData(0,0,w,h).data;
  const bright=(x,y,threshold=145)=>{const i=(y*w+x)*4;return data[i+3]>96&&Math.max(data[i],data[i+1],data[i+2])>threshold;};
  let body=-1,frameBottom=-1;
  for(let y=Math.max(0,h-slice-50);y<h;y++){let count=0;for(let x=0;x<w;x++)if(bright(x,y,205))count++;if(count>w*.6)body=y;let frameCount=0;for(let x=0;x<w;x++)if(bright(x,y))frameCount++;if(frameCount>w*.6)frameBottom=y;}
  if(body<0||body>=h-3)return;

  for(let y=frameBottom+1;y<h;y++)for(let x=Math.floor(w*.35);x<w*.65;x++)if(bright(x,y)){l=Math.min(l,x);r=Math.max(r,x);b=Math.max(b,y);}
  if(r<l||r-l>w*.25||b-cut<2)return;
  for(let x=l;x<=r;x++)if(bright(x,b)){tipSum+=x+.5;tipCount++;}
  l=Math.max(0,l-8);r=Math.min(w-1,r+8);
  const tail=document.createElement('canvas');tail.width=r-l+1;tail.height=b-cut+1;
  tail.getContext('2d').drawImage(image,l,cut,tail.width,tail.height,0,0,tail.width,tail.height);
  // Ricostruisci la linea inferiore sotto la vecchia punta usando la stessa cornice.
  for(let y=cut;y<h;y++){
   const i=(y*w+Math.floor(w*.25))*4;
   ctx.clearRect(l-12,y,r-l+25,1);
   ctx.fillStyle='rgba('+data[i]+','+data[i+1]+','+data[i+2]+','+(data[i+3]/255)+')';ctx.fillRect(l-12,y,r-l+25,1);
  }
  dialogueSkin={body:canvas.toDataURL('image/png'),tail:tail.toDataURL('image/png'),width:tail.width,height:tail.height,tipX:tipSum/tipCount-l,cut,h,slice};

function moveMorning(subject,target,epoch){return new Promise((resolve,reject)=>{let route;try{route=cinematicPath(subject,target);}catch(e){reject(e);return;}const motion={subject,route,index:0,resolve,epoch};morningMotions.set(subject,motion);morningMotion=motion;});}
function updateMorningMotion(dt){for(const motion of [...morningMotions.values()]){
 if(motion.epoch!==morningEpoch){morningMotions.delete(motion.subject);motion.resolve(false);continue;}const n=motion.subject;let budget=MORNING_TIMING.walk*(n===player?1.25:1)*dt;
 while(budget>0&&motion.index<motion.route.length){const to=motion.route[motion.index],dx=to.x-n.x,dy=to.y-n.y,d=Math.hypot(dx,dy);if(d<.01){motion.index++;continue;}n.direction=facing(dx,dy);const amount=Math.min(d,budget);n.x+=dx/d*amount;n.y+=dy/d*amount;budget-=amount;}
 const finished=motion.index>=motion.route.length;n.moving=!finished;if(finished)morningMotions.delete(n);if(n===player)drawPlayer();else drawNpc(n);if(finished)motion.resolve(true);
 }morningMotion=morningMotions.values().next().value||null;
}
function showMorningPage(){const q=dialogue?.morning;if(!q)return;const [who,text]=MORNING_LINES[q.index];dialogue.type=who==='Riccardo'?'story':'npc';dialogue.target=who==='Riccardo'?null:{type:'npc',key:'seoyoon',owner:seoyoonNpc,dog:false};setSpeechText(who+': '+text);updateInteractionUI();}
async function morningAction(action,epoch){if(!action)return true;morningBusy=true;resetInput();closeDialogue(false);if(action==='window'){
 await Promise.all([moveMorning(player,MORNING_WINDOW.riccardo,epoch),moveMorning(seoyoonNpc,MORNING_WINDOW.seoyoon,epoch)]);if(epoch!==morningEpoch)return false;player.direction=seoyoonNpc.direction='down';
 }else if(action==='step-back'){await Promise.all([moveMorning(player,MORNING_WINDOW.backRiccardo,epoch),moveMorning(seoyoonNpc,MORNING_WINDOW.backSeoyoon,epoch)]);if(epoch!==morningEpoch)return false;player.direction=seoyoonNpc.direction='down';}
 else if(action==='phone-pause'){await wait(700);}
 else if(action==='approach'){await moveMorning(seoyoonNpc,{x:player.x+40,y:player.y},epoch);player.direction=facing(seoyoonNpc.x-player.x,seoyoonNpc.y-player.y);seoyoonNpc.direction=facing(player.x-seoyoonNpc.x,player.y-seoyoonNpc.y);}
 else if(action==='join'){
  await moveMorning(seoyoonNpc,{x:player.x,y:player.y},epoch);if(epoch!==morningEpoch)return false;seoyoonNpc.actor.node.hidden=true;window.TaraiParty.joinSeoyoon();syncNightSeoyoon();partyNotice.hidden=false;localizeUI();$('partyNoticeOk').focus();return false;
 }
 if(epoch!==morningEpoch)return false;drawPlayer();drawNpc(seoyoonNpc);morningBusy=false;return true;}
async function startMorningScene(){
 if(morningRunner||nightState.phase!=='morning'||locationId!=='quarters'||partyMembers.seoyoon.joined)return;
 const epoch=++morningEpoch;morningRunner=true;morningBusy=true;resetInput();nightState.morningStarted=true;
 try{await loadSeoyoon();if(epoch!==morningEpoch)return;Object.assign(seoyoonNpc,FIRST_NIGHT_ROOM.seoyoon,{moving:true,talking:false});if(!npcs.includes(seoyoonNpc))npcs.push(seoyoonNpc);drawNpc(seoyoonNpc);
  await moveMorning(seoyoonNpc,{x:280,y:player.y},epoch);if(epoch!==morningEpoch)return;seoyoonNpc.direction=facing(player.x-seoyoonNpc.x,player.y-seoyoonNpc.y);player.direction=facing(seoyoonNpc.x-player.x,seoyoonNpc.y-player.y);drawPlayer();drawNpc(seoyoonNpc);morningBusy=false;openSpeech([''],{type:'story'});dialogue.morning={index:0};showMorningPage();
 }catch(e){if(epoch===morningEpoch){morningBusy=false;morningRunner=null;nightState.morningStarted=false;notice(tr('Unable to start the scene. Please try again.'));console.error(e);}}
}
const advanceBeforeMorning=advanceSpeech;advanceSpeech=function(){if(morningBusy)return;const q=dialogue?.morning;if(!q)return advanceBeforeMorning();if(speechPageIndex+1<speechPages.length){speechPageIndex++;paintBalloonPage();updateInteractionUI();return;}const index=q.index,action=MORNING_LINES[index][2],epoch=morningEpoch;
 if(!action){q.index++;showMorningPage();return;}
 void morningAction(action,epoch).then(ok=>{if(!ok||epoch!==morningEpoch)return;openSpeech([''],{type:'story'});dialogue.morning={index:index+1};showMorningPage();});
};
$('partyNoticeOk').onclick=async()=>{if(partyNotice.hidden)return;const epoch=morningEpoch;partyNotice.hidden=true;morningBusy=true;player.direction='down';drawPlayer();await wait(MORNING_TIMING.look);if(epoch!==morningEpoch)return;morningBusy=false;morningRunner=null;nightState.phase='morning-complete';nightState.morningStarted=false;refreshNightObjective();resetInput();updateInteractionUI();saveRpgGame();};
partyNotice.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('partyNoticeOk').click();}if(e.key==='Tab'){e.preventDefault();$('partyNoticeOk').focus();}});
const travelBeforeMorning=updateTravel;updateTravel=function(dt){travelBeforeMorning(dt);updateMorningMotion(dt);if(nightState.phase==='morning'&&!nightTransition&&!morningRunner&&!dialogue&&!intro&&!editor.open&&!menuOpen)void startMorningScene();};
const beginBeforeMorning=beginIntro;beginIntro=function(){morningEpoch++;for(const motion of morningMotions.values())motion.resolve(false);morningMotions.clear();morningMotion=null;morningBusy=false;morningRunner=null;partyNotice.hidden=true;bedMarker.hidden=true;beginBeforeMorning();if(savedLanguage())language=savedLanguage();localizeUI();};
const resumeBeforeMorning=resumeNightGame;resumeNightGame=async function(){const result=await resumeBeforeMorning();if(result){if(savedLanguage())setGameLanguage(savedLanguage(),{persist:false});syncNightSeoyoon();}return result;};resumeNightButton.onclick=()=>void resumeNightGame();
window.TaraiMorning={getState:()=>({phase:nightState.phase,busy:morningBusy,index:dialogue?.morning?.index??null,notice:!partyNotice.hidden,joined:partyMembers.seoyoon.joined}),start:startMorningScene};

let loadingMap=false,assetsStarted=false;
async function startGame(retry=false){
 if(loadingMap)return;loadingMap=true;ready=false;resetInput();$("loading").hidden=false;$("loadingTitle").textContent="Loading Seoul…";$("loadingText").textContent="Please wait.";$("retryLoad").hidden=true;
 try{
  await new Promise((resolve,reject)=>{mapImage.onload=resolve;mapImage.onerror=reject;mapImage.src=CONFIG.map+(retry?"?retry="+Date.now():"");});
  if(!assetsStarted){assetsStarted=true;await Promise.all([loadCharacters(),loadVehicles()]);setupTrain();}
  await balloonSkinsReady;
  rebuildDepth();for(const n of npcs){nearestFree(n);drawNpc(n);}ready=true;$("loading").hidden=true;resize();beginIntro();
 }catch(_){$("loadingTitle").textContent="Unable to load the map";$("loadingText").textContent="Controlla il nome della mappa e la sua posizione accanto a index.html.";$("retryLoad").hidden=false;}finally{loadingMap=false;}
}
$("retryLoad").onclick=()=>startGame(true);resize();startGame();requestAnimationFrame(tick);
